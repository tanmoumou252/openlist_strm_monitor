const FILLED_ICONS = new Set(['badge_in','badge_out','badge_que','star','check']);
// Brand icons use fixed multi-color fills (e.g., OpenList logo) that must not be overridden by currentColor
const BRAND_ICONS = new Set(['openlist']);

function icon(name, cls='') {
  const svg = ICONS[name] || ICONS['info'];
  const classes = ['material-icon'];
  if (FILLED_ICONS.has(name)) classes.push('filled');
  if (BRAND_ICONS.has(name)) classes.push('brand-icon');
  if (cls) classes.push(cls);
  return `<span class="${classes.join(' ')}" aria-hidden="true">${svg}</span>`;
}

// Dropdown toggle logic
function initDropdowns() {
  document.querySelectorAll('.dropdown-wrap').forEach(wrap => {
    const btn = wrap.querySelector('.dropdown-btn');
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      // Close other dropdowns
      document.querySelectorAll('.dropdown-wrap.open').forEach(w => { if (w !== wrap) w.classList.remove('open'); });
      wrap.classList.toggle('open');
    });
    wrap.querySelectorAll('.dropdown-item').forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        const val = item.dataset.val;
        const root = document.documentElement;
        if (wrap.id === 'theme-system-dd') {
          root.dataset.system = val;
        } else if (wrap.id === 'theme-color-dd') {
          root.dataset.color = val;
        } else if (wrap.id === 'theme-fontsize-dd') {
          root.dataset.font = val;
        }
        wrap.classList.remove('open');
        syncTheme();
        router();
      });
    });
  });
  // Close dropdowns on outside click
  document.addEventListener('click', () => {
    document.querySelectorAll('.dropdown-wrap.open').forEach(w => w.classList.remove('open'));
  });
}

// ============================================================
// Toast
// ============================================================
function showToast(msg, type='info') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  const iconMap = {success:'check',error:'error',info:'info'};
  const toastIconName = iconMap[type] || 'info';
  el.innerHTML = `${icon(toastIconName)}<span>${esc(msg)}</span>`;
  container.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 400);
  }, 3000);
}

// ============================================================
// Cache Stale Modal
// ============================================================
function _formatTimeAgo(ts) {
  const sec = Math.floor(Date.now() / 1000 - ts);
  if (sec < 60) return `${sec} 秒前`;
  if (sec < 3600) return `${Math.floor(sec / 60)} 分钟前`;
  if (sec < 86400) return `${Math.floor(sec / 3600)} 小时前`;
  return `${Math.floor(sec / 86400)} 天前`;
}

function showCacheStaleModal(itemCount, lastSync) {
  const existing = document.getElementById('cache-stale-modal');
  if (existing) existing.remove();
  const ago = lastSync ? _formatTimeAgo(lastSync) : '未知';
  const overlay = document.createElement('div');
  overlay.id = 'cache-stale-modal';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">${icon('warn')} TMDB 缓存已过期</div>
      <div class="modal-body">
        <p>当前缓存 ${itemCount} 项，上次同步：${ago}</p>
        <p>是否后台刷新？（约 30 秒，期间可正常使用页面）</p>
        <label class="modal-checkbox">
          <input type="checkbox" id="cache-never-remind"> 不再提醒
        </label>
      </div>
      <div class="modal-actions">
        <button class="modal-btn secondary" id="cache-modal-cancel">取消</button>
        <button class="modal-btn primary" id="cache-modal-ok">好的</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('cache-modal-cancel').onclick = () => {
    const cb = document.getElementById('cache-never-remind');
    if (cb.checked) _setUiConfig('tmdb_cache_never_remind', '1');
    overlay.remove();
  };
  document.getElementById('cache-modal-ok').onclick = async () => {
    const cb = document.getElementById('cache-never-remind');
    if (cb.checked) _setUiConfig('tmdb_cache_never_remind', '1');
    overlay.remove();
    showToast('后台同步已启动...', 'info');
    try {
      const resp = await fetch('/api/tmdb/watchlist/sync', { method: 'POST' });
      const data = await resp.json();
      if (data.success) showToast('同步完成后刷新页面即可看到最新数据', 'success');
      else showToast(data.message || '启动同步失败', 'error');
    } catch(e) {
      showToast('启动同步失败: ' + e.message, 'error');
    }
  };
}

// Copy path block content to clipboard
function copyPathBlock(el) {
  const texts = [];
  el.querySelectorAll('.path-line').forEach(line => {
    const label = line.querySelector('.path-label');
    const value = line.querySelector('.path-value');
    if (label && value) texts.push(label.textContent + ' ' + value.textContent);
  });
  const copyText = texts.join('\n');
  navigator.clipboard.writeText(copyText).then(() => {
    showToast('已复制路径到剪贴板', 'success');
  }).catch(() => {
    // Fallback: select text
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges();
    showToast('已复制路径到剪贴板', 'success');
  });
}

// ============================================================
// Format helpers
// ============================================================
function fmtTime(ts) {
  if (!ts) return '-';
  const d = new Date(ts * 1000);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${mm}-${dd} ${hh}:${mi}`;
}

function esc(s) {
  const el = document.createElement('span');
  el.textContent = s || '';
  return el.innerHTML;
}

// ============================================================
// Router
// ============================================================
let _serverStartTime = null; // 从 /api/dashboard 响应的 uptime 初始化

function buildNav(activeTab) {
  const links = [
    ['dashboard','仪表盘','dashboard'],
    ['area_b','B 区','area_b'],
    ['area_a','A 区','area_a'],
    ['area_c','C 区','area_c'],
    ['tmdb','TMDB','tmdb'],
    ['logs','WebUI日志','log'],
    ['config','配置','config'],
  ];
  // Area links default to kind=anime filter
  const areaLinkMap = { area_b: '?kind=anime', area_a: '?kind=anime', area_c: '?kind=anime' };
  return links.map(([id,label,ic]) => {
    const cls = id === activeTab ? ' class="active"' : '';
    const href = areaLinkMap[id] ? `#${id}${areaLinkMap[id]}` : `#${id}`;
    return `<a href="${href}" data-tab="${id}"${cls}>${icon(ic)} ${label}</a>`;
  }).join('\n');
}

function parseHash() {
  const hash = location.hash.slice(1) || 'dashboard';
  const [page, qstr] = hash.split('?');
  const params = {};
  if (qstr) {
    for (const kv of qstr.split('&')) {
      const [k, v] = kv.split('=');
      params[decodeURIComponent(k)] = decodeURIComponent(v || '');
    }
  }
  return { page, params };
}

function navigate(hash) {
  location.hash = hash;
}

async function router() {
  const { page, params } = parseHash();
  const mainEl = document.getElementById('app-main');
  const navEl = document.getElementById('main-nav');

  // Update nav
  navEl.innerHTML = buildNav(page);

  // Update uptime
  updateUptime();

  // Show loading
  mainEl.innerHTML = '<div class="loading"><div class="spinner"></div> 加载中...</div>';

  try {
    if (page === 'dashboard') await renderDashboard(mainEl);
    else if (page.startsWith('area_')) await renderArea(mainEl, page.replace('area_',''), params);
    else if (page === 'tmdb') await renderTmdb(mainEl, params);
    else if (page === 'logs') await renderLogs(mainEl);
    else if (page === 'config') await renderConfig(mainEl, params);
    else mainEl.innerHTML = '<div class="error-msg">页面不存在</div>';
  } catch(e) {
    console.error('Router error:', e);
    mainEl.innerHTML = `<div class="error-msg">${icon('error')} ${esc(e.message)}</div>`;
  }
}

// ============================================================
// API helpers
// ============================================================
async function api(path, timeoutMs = 10000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const resp = await fetch(path, { signal: ctrl.signal });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${resp.status}`);
    }
    return resp.json();
  } finally {
    clearTimeout(timer);
  }
}

async function renderAreaList(el, area, params) {
  const kind = params.kind || 'anime';
  const q = params.q || '';
  const sort = params.sort || 'name';
  const order = params.order || 'asc';
  const page = parseInt(params.page) || 1;
  let url = `/api/area/${area}`;
  const qs = [];
  qs.push('kind=' + encodeURIComponent(kind));
  if (q) qs.push('q=' + encodeURIComponent(q));
  if (sort) qs.push('sort=' + encodeURIComponent(sort));
  if (order) qs.push('order=' + encodeURIComponent(order));
  qs.push('page=' + page);
  if (qs.length) url += '?' + qs.join('&');

  const d = await api(url);
  const kindLabel = d.kind_label;

  // Category tabs
  const kinds = [{v:'anime',l:'番剧',i:'tv'},{v:'movie',l:'电影',i:'movie'}];  const tabsHtml = kinds.map(k => {
    const active = (kind||'') === k.v ? ' active' : '';
    const href = `#area_${area}?kind=${k.v}&sort=${sort}&order=${order}`;
    const count = d.kind_counts[k.v]||0;
    return `<button class="category-tab${active}" data-kind-href="${href}">${icon(k.i)} ${k.l} <span class="count">${count}</span></button>`;
  }).join('');

  // Sort link helper
  function sortLink(colName, colKey) {
    const newOrder = (sort === colKey && order === 'asc') ? 'desc' : 'asc';
    const arrow = sort === colKey ? (order === 'asc' ? icon('arrow_up') : icon('arrow_down')) : '';
    const href = `#area_${area}?sort=${colKey}&order=${newOrder}${kind?'&kind='+encodeURIComponent(kind):''}${q?'&q='+encodeURIComponent(q):''}`;
    return `<a href="${href}" style="color:var(--primary);text-decoration:none;display:inline-flex;align-items:center;gap:2px;font-weight:600;font-size:calc(var(--font-base) - 1px)" class="sort-btn">${colName}${arrow}</a>`;
  }

  // Media cards
  const _kindIconMap = {'番剧':'tv','动漫':'tv','动画':'tv','电影':'movie'};
  const cardsHtml = d.media_items.map(item => {
    const href = `#area_${area}?media=${encodeURIComponent(item.name)}${kind?'&kind='+encodeURIComponent(kind):''}${q?'&q='+encodeURIComponent(q):''}`;
    const cardIcon = _kindIconMap[item.kind] || 'tv';
    return `<a class="media-card" href="${href}">${icon(cardIcon)}<div class="title">${esc(item.name)}</div><div class="meta">${item.count} 个文件</div></a>`;
  }).join('');

  // Pager
  let pagerHtml = '';
  if (d.total_pages > 1) {
    pagerHtml = '<div class="pager">';
    if (d.page > 1) {
      pagerHtml += `<a href="#area_${area}?page=${d.page-1}&sort=${sort}&order=${order}${kind?'&kind='+encodeURIComponent(kind):''}${q?'&q='+encodeURIComponent(q):''}">${icon('chevron_l')} 上一页</a>`;
    }
    pagerHtml += `<span class="current">第 ${d.page} / ${d.total_pages} 页 (共 ${d.total} 项)</span>`;
    if (d.page < d.total_pages) {
      pagerHtml += `<a href="#area_${area}?page=${d.page+1}&sort=${sort}&order=${order}${kind?'&kind='+encodeURIComponent(kind):''}${q?'&q='+encodeURIComponent(q):''}">下一页 ${icon('chevron_r')}</a>`;
    }
    pagerHtml += '</div>';
  }

  el.innerHTML = `
<h2 style="font-size:20px;margin-bottom:20px;color:var(--text-main)">${icon(kind === 'movie' ? 'movie' : 'tv','ui-icon-lg')} ${esc(kindLabel)} 媒体浏览</h2>
<div class="category-tabs">${tabsHtml}</div>
<div class="toolbar">
  <div class="search-wrap">${icon('search','search-prefix')}<input type="text" id="media-search" placeholder="搜索媒体名..." value="${esc(q)}"></div>
  <button class="search-btn" id="area-search-btn">${icon('search')} 搜索</button>
  <span style="font-size:calc(var(--font-base) - 1px);color:var(--text-muted);margin-left:8px">排序:</span>
  ${sortLink('名称','name')}
  ${sortLink('文件数','count')}
  ${sortLink('时间','time')}
</div>
<div class="media-grid">${cardsHtml}</div>
${pagerHtml}`;

  // Bind search
  document.getElementById('area-search-btn').addEventListener('click', () => {
    const val = document.getElementById('media-search').value.trim();
    let h = `#area_${area}?sort=${sort}&order=${order}`;
    const p = [];
    if (kind) p.push('kind=' + encodeURIComponent(kind));
    if (val) p.push('q=' + encodeURIComponent(val));
    if (p.length) h += '&' + p.join('&');
    // 空搜索且当前页面也无搜索词时，不触发导航（避免无意义的刷新）
    if (val === (q || '')) return;
    navigate(h);
  });
  document.getElementById('media-search').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('area-search-btn').click();
  });
  // Bind category tabs (use navigate to avoid full page reload)
  document.querySelectorAll('.category-tab[data-kind-href]').forEach(tab => {
    tab.addEventListener('click', (e) => {
      e.preventDefault();
      navigate(tab.dataset.kindHref);
    });
  });
}

async function renderAreaDetail(el, area, params) {
  const media = params.media;
  const kind = params.kind || '';
  const sort = params.sort || 'name';
  const order = params.order || 'asc';
  const page = parseInt(params.page) || 1;
  const q = params.q || '';

  let url = `/api/area/${area}/detail?media=${encodeURIComponent(media)}`;
  if (sort) url += '&sort=' + encodeURIComponent(sort);
  if (order) url += '&order=' + encodeURIComponent(order);
  url += '&page=' + page;

  const d = await api(url);

  // Strip path prefix helper: strip local_root / webdav_root from path
  function stripPath(p, root) {
    if (root && p.startsWith(root)) return p.slice(root.length);
    return p;
  }
  const localRoot = d.local_root || '';
  const webdavRoot = d.webdav_root || '';

  // Back bar
  const kindPart = kind ? '?kind=' + encodeURIComponent(kind) : '';
  const areaLabels = {a:'A 区',b:'B 区',c:'C 区'};
  const areaLabel = areaLabels[area] || area.toUpperCase() + ' 区';
  let html = `
<div class="toolbar" style="gap:12px">
  <a href="#area_${area}${kindPart}" class="back-icon-btn" title="返回列表">${icon('back')}</a>
  <span style="color:var(--text-main);font-size:14px;font-weight:600">${esc(media)}</span>
  <span style="color:var(--text-muted);font-size:calc(var(--font-base) - 1px)">· ${d.total} 个文件</span>
</div>`;

  // Show media folder paths (left) + expand/collapse buttons (right) in one row
  const expandBtns = `<div class="detail-actions">
  <button class="toolbar-btn" id="expand-all-btn" style="display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--primary) 10%,transparent);border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);border-radius:var(--radius-control);padding:6px 14px;color:var(--primary);font-size:calc(var(--font-base) - 1px);font-weight:500;cursor:pointer;font-family:inherit">${icon('expand')} 展开全部</button>
  <button class="toolbar-btn" id="collapse-all-btn" style="display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--primary) 10%,transparent);border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);border-radius:var(--radius-control);padding:6px 14px;color:var(--primary);font-size:calc(var(--font-base) - 1px);font-weight:500;cursor:pointer;font-family:inherit">${icon('collapse')} 折叠全部</button>
</div>`;

  if (localRoot || webdavRoot) {
    html += `<div class="area-detail-head"><div class="area-path-block">`;
    if (localRoot) html += `<div class="path-line"><span class="path-label">${areaLabel} 本地根：</span><span class="path-value mono">${esc(localRoot)}</span></div>`;
    if (webdavRoot) html += `<div class="path-line"><span class="path-label">WebDAV 根：</span><span class="path-value mono">${esc(webdavRoot)}</span></div>`;
    html += `</div>${expandBtns}</div>`;
  } else {
    html += `<div class="area-detail-head" style="justify-content:flex-end">${expandBtns}</div>`;
  }

  // Sort link helper
  function sortLink(colName, colKey) {
    const newOrder = (sort === colKey && order === 'asc') ? 'desc' : 'asc';
    const arrow = sort === colKey ? (order === 'asc' ? icon('arrow_up') : icon('arrow_down')) : '';
    let href = `#area_${area}?media=${encodeURIComponent(media)}&sort=${colKey}&order=${newOrder}`;
    if (kind) href += '&kind=' + encodeURIComponent(kind);
    if (q) href += '&q=' + encodeURIComponent(q);
    return `<a href="${href}" style="color:var(--primary);text-decoration:none;display:inline-flex;align-items:center;gap:2px" class="sort-btn">${colName}${arrow}</a>`;
  }

  // Season details
  for (const season of d.seasons) {
    html += `<details class="season-details" open><summary>${esc(season.label)} <span style="font-size:calc(var(--font-base) - 1px);color:var(--text-muted)">(${season.records.length} 个文件)</span></summary>`;
    html += '<div class="table-wrap"><table><thead><tr><th>序号</th>';

    if (area === 'a') {
      html += `<th>${sortLink('本地路径','path')}</th><th>WebDAV 路径</th><th>${sortLink('时间','time')}</th>`;
    } else if (area === 'b') {
      html += `<th>${sortLink('本地路径','path')}</th><th>WebDAV 路径</th><th>指纹</th><th>状态</th><th>${sortLink('时间','time')}</th>`;
    } else if (area === 'c') {
      html += `<th>${sortLink('本地路径','path')}</th><th>WebDAV 路径</th><th>原 B 路径</th><th>幽灵根</th><th>${sortLink('时间','time')}</th>`;
    }

    html += '</tr></thead><tbody>';

    season.records.forEach((r, i) => {
      html += '<tr>';
      html += `<td>${i+1}</td>`;
      if (area === 'a') {
        html += `<td class="mono" title="${esc(r.local_path)}">${esc(stripPath(r.local_path, localRoot))}</td><td class="mono" title="${esc(r.webdav_path)}">${esc(stripPath(r.webdav_path, webdavRoot))}</td><td>${fmtTime(r.updated_at)}</td>`;
      } else if (area === 'b') {
        const fp = r.fingerprint || '-'; const fpShort = fp.length > 5 ? fp.substring(0,5) + '...' : fp;
        html += `<td class="mono" title="${esc(r.local_path)}">${esc(stripPath(r.local_path, localRoot))}</td><td class="mono" title="${esc(r.webdav_path)}">${esc(stripPath(r.webdav_path, webdavRoot))}</td><td class="mono" style="font-size:calc(var(--font-base) - 2px);cursor:default" title="${esc(fp)}">${esc(fpShort)}</td><td>${esc(r.status||'-')}</td><td>${fmtTime(r.updated_at)}</td>`;
      } else if (area === 'c') {
        html += `<td class="mono" title="${esc(r.local_path)}">${esc(stripPath(r.local_path, localRoot))}</td><td class="mono" title="${esc(r.webdav_path)}">${esc(stripPath(r.webdav_path, webdavRoot))}</td><td class="mono">${esc(r.original_b_path||'-')}</td><td class="mono">${esc(r.ghost_root||'-')}</td><td>${fmtTime(r.moved_at)}</td>`;
      }
      html += '</tr>';
    });

    html += '</tbody></table></div></details>';
  }

  // Pager
  if (d.total_pages > 1) {
    html += '<div class="pager">';
    if (d.page > 1) {
      html += `<a href="#area_${area}?media=${encodeURIComponent(media)}&page=${d.page-1}&sort=${sort}&order=${order}${kind?'&kind='+encodeURIComponent(kind):''}">${icon('chevron_l')} 上一页</a>`;
    }
    html += `<span class="current">第 ${d.page} / ${d.total_pages} 页</span>`;
    if (d.page < d.total_pages) {
      html += `<a href="#area_${area}?media=${encodeURIComponent(media)}&page=${d.page+1}&sort=${sort}&order=${order}${kind?'&kind='+encodeURIComponent(kind):''}">下一页 ${icon('chevron_r')}</a>`;
    }
    html += '</div>';
  }

  el.innerHTML = html;

  // Bind expand/collapse
  const expandAllBtn = document.getElementById('expand-all-btn');
  const collapseAllBtn = document.getElementById('collapse-all-btn');
  const setDetailToggleState = (opened) => {
    expandAllBtn?.classList.toggle('is-active', opened);
    collapseAllBtn?.classList.toggle('is-active', !opened);
  };
  expandAllBtn?.addEventListener('click', () => {
    document.querySelectorAll('.season-details').forEach(d => d.setAttribute('open', ''));
    setDetailToggleState(true);
  });
  collapseAllBtn?.addEventListener('click', () => {
    document.querySelectorAll('.season-details').forEach(d => d.removeAttribute('open'));
    setDetailToggleState(false);
  });
  setDetailToggleState(document.querySelectorAll('.season-details').length > 0);

}

async function renderTmdb(el, params) {
  const status = await api('/api/tmdb/status');
  if (!status.configured) {
    el.innerHTML = `
<h2 style="font-size:20px;margin-bottom:20px;color:var(--text-main)">${icon('tmdb','ui-icon-lg')} TMDB 待看列表</h2>
<div style="background:color-mix(in srgb,var(--primary) 10%,var(--bg-card));border:1px solid color-mix(in srgb,var(--primary) 24%,transparent);border-radius:10px;padding:20px;color:var(--text-main);font-size:var(--font-base);display:flex;align-items:center;gap:10px">
  ${icon('warn')} 未配置 TMDB access_token，请在配置页面 → TMDB 设置中填入 access_token。
</div>`;
    return;
  }

  // 检查缓存是否过期 & 是否已设"从不提醒"
  const neverRemind = _getUiConfig('tmdb_cache_never_remind');
  if (status.cache_stale && !neverRemind) {
    showCacheStaleModal(status.cache_item_count || 0, status.cache_last_sync || 0);
  }

  // 收录状态未计算提示
  if (status.match_uncomputed > 0 && status.match_total > 0 && !_getUiConfig('tmdb_match_toast_disabled')) {
    showToast(
      `${status.match_uncomputed} / ${status.match_total} 个条目收录状态未计算，建议点击配置页「刷新收录状态」`,
      'info'
    );
  }

  const mediaType = params.type || 'movie';
  const page = parseInt(params.page) || 1;
  const q = params.q || '';
  const statusFilter = params.status || '';

  // Fetch watchlist (with client-side cache + dedup)
  const apiType = mediaType === 'movie' ? 'movies' : mediaType;
  const cached = _getCachedWatchlist(apiType);
  let data;
  if (cached) {
    data = cached;
  } else if (_fetchPromises[apiType]) {
    // Another page navigation is already fetching all data — wait for it
    data = await _fetchPromises[apiType];
  } else {
    const url = `/api/tmdb/watchlist/${apiType}?all=1`;
    _fetchPromises[apiType] = api(url);
    try {
      data = await _fetchPromises[apiType];
      _setCachedWatchlist(apiType, data);
    } finally {
      _fetchPromises[apiType] = null;
    }
  }
  let items = data.results || [];

  // Search filter
  if (q) {
    const ql = q.toLowerCase();
    items = items.filter(it => {
      const t = (it.title || it.name || '').toLowerCase();
      const ot = (it.original_title || it.original_name || '').toLowerCase();
      return t.includes(ql) || ot.includes(ql);
    });
  }

  // Status filter
  if (statusFilter && ['in','out','que'].includes(statusFilter)) {
    items = items.filter(it => (it._status || 'out') === statusFilter);
  }

  // Pagination
  const pageSize = 50;
  const total = items.length;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  const curPage = Math.min(Math.max(page, 1), totalPages);
  const pageItems = items.slice((curPage - 1) * pageSize, curPage * pageSize);

  // Count statuses
  const statusCounts = { in: 0, out: 0, que: 0 };
  (data.results || []).forEach(it => { statusCounts[it._status || 'out']++; });

  // Build HTML
  // Always use official TMDB web host for external links (TMDB item pages, profile)
  const _tmdbOfficialBase = 'https://www.themoviedb.org';
  const avatarHash = status.avatar_path || '';
  const avatarUrl = avatarHash ? `/api/tmdb/avatar?hash=${encodeURIComponent(avatarHash)}` : '';
  const username = status.username || data.account_id || '';
  const watchlistUrl = username ? `${_tmdbOfficialBase}/u/${username}` : `#`;
  // TMDB 官方 CDN logo URLs（header / card 分开使用）
  const _TMDB_LOGO_HEADER_CDN = 'https://www.themoviedb.org/assets/2/v4/logos/v2/blue_square_2-d537fb228cf3ded904ef09b136fe3fec72548ebc1fea3fbbd1ad9e36364db38b.svg';
  const _TMDB_LOGO_CARD_CDN = 'https://www.themoviedb.org/assets/2/v4/logos/v2/blue_square_1-5bdc75aaebeb75dc7ae79426ddd9be3b2be1e342510f8202baf6bffa71d7f5c4.svg';
  // TMDB logo 内联兜底 SVG
  const _TMDB_LOGO_FALLBACK = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="4" fill="#01B4E4"/><text x="50%" y="54%" dominant-baseline="central" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-weight="700" font-size="12">TMDB</text></svg>');
  // 按三优先级决定 TMDB logo 图片源：反代host → 对应官方CDN → 内联兜底
  function _resolveTmdbLogoUrl(s, kind) {
    const asset = kind === 'header' ? _TMDB_LOGO_HEADER_CDN : _TMDB_LOGO_CARD_CDN;
    if (s.host && !s.host.startsWith('https://api.themoviedb.org')) {
      return s.host.replace(/\/+$/, '') + asset.replace('https://www.themoviedb.org', '');
    }
    return asset;
  }
  const tmdbLogoUrl = _resolveTmdbLogoUrl(status, 'header');
  const avatarLinkUrl = username ? `${_tmdbOfficialBase}/u/${username}/watchlist` : '#';
  // Merged header: left (h2+avatar) + center (legend badges) + right (tabs+page-info)
  let html = `<div class="status-legend" style="justify-content:flex-start;align-items:center;gap:8px;padding:10px 14px">
  <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
<h2 class="tmdb-header-title" style="font-size:17px;margin:0;color:var(--text-main);display:flex;align-items:center;gap:8px;white-space:nowrap"><span class="tmdb-header-logo-box"><img src="${tmdbLogoUrl}" alt="TMDB" class="tmdb-header-logo" onerror="this.src='${_TMDB_LOGO_FALLBACK}'" loading="lazy"></span><span>待看列表</span></h2>
    ${avatarUrl ? `<a href="${esc(avatarLinkUrl)}" target="_blank" rel="noopener" title="查看待看列表" style="line-height:0;display:flex"><img class="tmdb-avatar" src="${avatarUrl}" alt="avatar" referrerpolicy="no-referrer"></a>` : ''}
  </div>
  <div style="flex:1;display:flex;justify-content:center;gap:6px;flex-wrap:wrap">`;
  const legendItems = [['in','已收录','badge_in'],['out','未收录','badge_out'],['que','存疑','badge_que']];
  legendItems.forEach(([sv,sl,si]) => {
    const activeCls = statusFilter === sv ? ' active' : '';
    const href = `#tmdb?type=${mediaType}&status=${sv}`;
    html += `<a class="legend-badge ${sv}${activeCls}" href="${href}">${icon(si)} ${sl} (${statusCounts[sv]||0})</a>`;
  });
  html += '</div>';
  // Right: separator + type tabs + dot + page-info
  html += '<div style="display:flex;align-items:center;gap:6px;flex-shrink:0">';
  html += '<span style="width:1px;height:20px;background:color-mix(in srgb,var(--border-color) 30%,transparent)"></span>';
  html += `<a class="type-tab${mediaType==='movie'?' active':''}" href="#tmdb?type=movie" style="padding:4px 10px">${icon('movie')} 电影</a>`;
  html += `<a class="type-tab${mediaType==='tv'?' active':''}" href="#tmdb?type=tv" style="padding:4px 10px;margin-left:0">${icon('tv')} 剧集</a>`;
  html += `<span style="color:var(--text-muted);margin:0 4px">·</span>`;
  html += `<span class="tmdb-page-info" style="padding:4px 10px">第 ${curPage}/${totalPages} 页 · 共 ${total} 项</span>`;
  html += `<span style="width:1px;height:16px;background:color-mix(in srgb,var(--border-color) 30%,transparent);flex-shrink:0"></span>`;
  html += `<button class="tmdb-export-btn" id="tmdb-export-csv" title="导出 CSV">${icon('csv')}</button>`;
  html += `<a class="tmdb-export-btn" href="/api/tmdb/watchlist/movies?all=1" target="_blank" title="电影 JSON">${icon('json')}</a>`;
  html += `<a class="tmdb-export-btn" href="/api/tmdb/watchlist/tv?all=1" target="_blank" title="剧集 JSON">${icon('tv')}</a>`;
  html += '</div></div>';

  // Search
  html += `<div class="toolbar"><div class="search-wrap">${icon('search','search-prefix')}<input type="text" id="tmdb-search" placeholder="搜索待看列表..." value="${esc(q)}"></div><button class="search-btn" id="tmdb-search-btn">${icon('search')} 搜索</button></div>`;

  // Cards
  const stateMap = {in:'已收录',out:'未收录',que:'有疑问'};
  const stateIconMap = {in:'badge_in',out:'badge_out',que:'badge_que'};
  html += '<div class="tmdb-grid">';
  pageItems.forEach(item => {
    const title = item.title || item.name || 'N/A';
    const originalTitle = item.original_title || item.original_name || '';
    const date = item.release_date || item.first_air_date || '';
    const rating = item.vote_average || 0;
    const overview = item.overview || '';
    const posterPath = item.poster_path || '';
    const tmdbId = item.id;
    const st = item._status || 'out';
    const stLabel = stateMap[st] || '未收录';
    const stIcon = stateIconMap[st] || 'help';
    const seasonCount = item._season_count || 0;
    const seasonBarsHtml = seasonCount > 1 ? `<div class="tmdb-season-bars">${_renderSeasonBars(seasonCount)}</div>` : '';
    // ... rest of card per-item vars

    const backdropPath = item.backdrop_path || '';
    const posterUrl = posterPath ? `/api/tmdb/poster?path=${encodeURIComponent(posterPath)}&w=342` : '';
    const backdropUrl = backdropPath ? `/api/tmdb/poster?path=${encodeURIComponent(backdropPath)}&w=780` : '';
    // TMDB 详情外链 — 始终指向官方域名，不走反代
    const detailUrl = `${_tmdbOfficialBase}/${mediaType}/${tmdbId}`;
    html += `<div class="tmdb-flip-wrapper" data-tmdb-id="${tmdbId}" data-tmdb-type="${mediaType}" data-backdrop="${esc(backdropUrl || '')}">
  ${seasonBarsHtml}
  <!-- Front face -->
     <div class="tmdb-flip-front">
       <div class="title">${esc(title)}</div>
       <div class="meta">
         <span class="tmdb-rating-block">
           <span class="tmdb-rating-label">评分</span>
           <svg class="tmdb-rating-icon" viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
           <span class="tmdb-rating-value">${rating.toFixed(1)}</span>
         </span>
         · ${esc(date)}
         <span class="tmdb-card-status-inline ${st}">${icon(stIcon)} ${esc(stLabel)}</span>
         <a class="tmdb-jump-btn" href="${esc(detailUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="前往 TMDB 查看详情">
           <img class="tmdb-jump-logo" src="${_resolveTmdbLogoUrl(status, 'card')}" alt="TMDB" onerror="this.src='${_TMDB_LOGO_FALLBACK}'" loading="lazy">

         </a>
       </div>

    <div class="tmdb-overview">${esc(overview)}</div>

  <!-- Back face (flip) -->

    </div>

  });
  html += '</div>';

  // Pager
  const sp = statusFilter ? '&status=' + statusFilter : '';
  const qp = q ? '&q=' + encodeURIComponent(q) : '';

  html += `<span class="tmdb-page-info">第 ${curPage} / ${totalPages} 页</span>`;
  if (curPage < totalPages) html += `<a class="pager-btn" href="#tmdb?type=${mediaType}&page=${curPage+1}${qp}${sp}">下一页 ${icon('chevron_r')}</a>`;
  html += '</div>';

  el.innerHTML = html;

  // Bind search
  document.getElementById('tmdb-search-btn').addEventListener('click', () => {
    const val = document.getElementById('tmdb-search').value.trim();
    let h = `#tmdb?type=${mediaType}`;
    if (val) h += '&q=' + encodeURIComponent(val);
    navigate(h);
  });
  document.getElementById('tmdb-search').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('tmdb-search-btn').click();
  });

  // Bind export
  document.getElementById('tmdb-export-csv').addEventListener('click', async () => {
    const btn = document.getElementById('tmdb-export-csv');
    btn.disabled = true;
    btn.title = '导出中...';
    btn.innerHTML = `${icon('download')}`;
    try {

      else showToast(data.message || '导出失败', 'error');
    } catch(err) {
      showToast('导出失败: ' + err.message, 'error');

      btn.disabled = false;
      btn.title = '导出 CSV';
      btn.innerHTML = `${icon('csv')}`;
    }
  });

  // --- TMDB flip card initialization ---
  _initFlipCards();
}

// ============================================================
// TMDB Flip Card Logic (click toggle)
// ============================================================
let _flippedCard = null; // current flipped tmdbId
const _genreCache = {};   // { "type_id": [genreName, ...] }

function _initFlipCards() {
  document.querySelectorAll('.tmdb-flip-wrapper').forEach(wrapper => {
    const id = wrapper.dataset.tmdbId;
    const type = wrapper.dataset.tmdbType;

    // 触发多季标签懒加载（首次渲染后异步获取季数）
    _lazyLoadSeasonCount(wrapper);


    // Click to toggle flip (skip if clicking a link, e.g. TMDB logo btn)
    wrapper.addEventListener('click', (e) => {
      // Poster retry: clicking the error area reloads the poster image
      if (e.target.closest('.tt-poster-error[data-poster]')) {
        _loadPoster(wrapper);
        return;
      }
      if (e.target.closest('a')) return;

      if (wrapper.classList.contains('flipped')) {
        _flipBack(id);
      } else {
        // Collapse any other flipped card first
        if (_flippedCard && _flippedCard !== id) _flipBack(_flippedCard);
        _flipForward(wrapper, id, type);
      }
    });
  });
}

function _flipForward(wrapper, id, type) {
  wrapper.classList.add('flipped');
  _flippedCard = id;
  _loadGenres(id, type);
  _loadPoster(wrapper);

  // Set backdrop background
  const backdropUrl = wrapper.dataset.backdrop;
  const backFace = wrapper.querySelector('.tmdb-flip-back');
  if (backdropUrl && backFace) {
    backFace.style.backgroundImage = `url(${backdropUrl})`;
  }
}

/* 海报 SVG 占位图 */
const _POSTER_FALLBACK_SVG = '<svg class="tt-poster-fallback-svg" viewBox="0 0 60 90" fill="none"><rect x="2" y="2" width="56" height="86" rx="4" stroke="currentColor" stroke-width="1.5" opacity="0.35"/><path d="M22 32v26l18-13-18-13z" fill="currentColor" opacity="0.25"/></svg>';

/* 多季番剧竖杠生成 */
function _renderSeasonBars(count) {
  if (count <= 1) return '';
  const palette = ['bar-green', 'bar-blue', 'bar-purple'];
  const numBars = count >= 5 ? 3 : (count >= 3 ? 2 : 1);
  return palette.slice(0, numBars).map(function(c) {
    return '<span class="tmdb-season-bar ' + c + '"></span>';
  }).join('');
}

/* 懒加载多季标签：卡片渲染后异步获取季数，避免阻塞首屏 */
async function _lazyLoadSeasonCount(wrapper) {
  const id = wrapper.dataset.tmdbId;
  const type = wrapper.dataset.tmdbType;
  if (type !== 'tv' || !id) return;
  // 避免重复请求
  if (wrapper.dataset.seasonLoaded) return;
  wrapper.dataset.seasonLoaded = '1';
  // 如果已有 bars（持久化缓存已有 _season_count），跳过
  if (wrapper.querySelector('.tmdb-season-bars')) return;
  try {
    const resp = await fetch('/api/tmdb/season-count/' + type + '/' + id);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const count = data.season_count || 0;
    if (count > 1) {
      const bars = document.createElement('div');
      bars.className = 'tmdb-season-bars';
      bars.innerHTML = _renderSeasonBars(count);
      wrapper.insertBefore(bars, wrapper.firstChild);
    }
  } catch (e) {
    // 静默失败，不显示 bars
  }
}

function _loadPoster(wrapper) {
  const posterWrap = wrapper.querySelector('.tt-poster-wrap');
  if (!posterWrap) return;
  const posterUrl = posterWrap.dataset.poster;

  // No poster URL at all
  if (!posterUrl) {
    posterWrap.innerHTML = `<div class="tt-poster-error">${_POSTER_FALLBACK_SVG}<span class="tt-poster-retry-text">暂无海报</span></div>`;
    return;
  }

  // Show loading spinner then load image
  posterWrap.innerHTML = '<div class="tt-poster-loading"><div class="spinner"></div></div>';
  const img = new Image();
  img.className = 'tt-poster';
  img.alt = 'poster';
  img.referrerPolicy = 'no-referrer';
  img.onload = () => {
    const loading = posterWrap.querySelector('.tt-poster-loading');
    if (loading) loading.replaceWith(img);
  };
  img.onerror = () => {
    posterWrap.innerHTML = `<div class="tt-poster-error" data-poster="${posterUrl}">${_POSTER_FALLBACK_SVG}<span class="tt-poster-retry-text">稍后重试</span></div>`;
  };
  img.src = posterUrl;
}

function _flipBack(id) {
  const wrapper = document.querySelector(`.tmdb-flip-wrapper[data-tmdb-id="${id}"]`);
  if (wrapper) {
    wrapper.classList.remove('flipped');
    // Remove backdrop background to save memory
    const backFace = wrapper.querySelector('.tmdb-flip-back');
    if (backFace) {
      backFace.style.backgroundImage = '';
    }
  }
  if (_flippedCard === id) _flippedCard = null;
}

async function _loadGenres(tmdbId, type) {
  const cacheKey = `${type}_${tmdbId}`;
  const container = document.getElementById(`genre-${tmdbId}`);

  if (!container) return;

  if (_genreCache[cacheKey]) { _renderGenres(container, _genreCache[cacheKey]); return; }

  try {
    const resp = await fetch(`/api/tmdb/genres/${type}/${tmdbId}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    const genres = data.genres || [];
    _genreCache[cacheKey] = genres;
    _renderGenres(container, genres);
  } catch(e) {
    console.error('[genres] error:', e);
    container.innerHTML = `<span class="tt-tag tt-empty">暂无信息</span>`;
  }
}

function _renderGenres(container, genres) {
  if (!genres.length) { container.innerHTML = `<span class="tt-tag tt-empty">暂无分类</span>`; return; }
  container.innerHTML = genres.map(g => {
    const truncated = g.length > 4 ? g.substring(0, 4) + '…' : g;
    const titleAttr = g.length > 4 ? ` title="${esc(g)}"` : '';
    return `<span class="tt-tag tt-genre"${titleAttr}>${esc(truncated)}</span>`;
  }).join('');
}

// Render: Logs (TMDB 操作日志)

async function renderLogs(el) {
  const data = await api('/api/tmdb/logs');
  const logs = data.logs || [];

  const levelColor = { 'info': 'var(--primary)', 'success': '#188038', 'warn': '#e37400', 'error': '#d93025' };
  const levelIcon = { 'info': 'info', 'success': 'check', 'warn': 'warn', 'error': 'error' };
  const opLabel = {
    'sync_start': '同步启动', 'sync': '同步', 'match_refresh_start': '匹配刷新启动',
    'match_refresh': '匹配刷新', 'config_update': '配置更新', 'match_override': '状态覆盖', 'restart': '重启'
  };

  const rows = logs.map(log => {
    const lv = log.level || 'info';
    const color = levelColor[lv] || 'var(--text-muted)';
    const ic = levelIcon[lv] || 'info';
    const opText = opLabel[log.op] || log.op;
    const ts = log.ts ? fmtTime(log.ts) : '-';
    return `<tr>
      <td style="white-space:nowrap">${esc(ts)}</td>
      <td><span style="color:var(--primary)">${esc(opText)}</span></td>
      <td><span style="color:${color};display:inline-flex;align-items:center;gap:4px">${icon(ic)} ${esc(lv)}</span></td>
      <td>${esc(log.msg)}</td>
    </tr>`;
  }).join('');

  el.innerHTML = `
<h2 style="font-size:20px;margin-bottom:16px;color:var(--text-main)">${icon('log','ui-icon-lg')} webui日志</h2>
<p style="color:var(--text-muted);font-size:calc(var(--font-base) - 2px);margin:-8px 0 16px">此处是 WebUI TMDB 相关操作的日志，并非主程序的日志</p>
<div class="toolbar">
  <button class="toolbar-btn" id="logs-refresh">${icon('refresh')} 刷新</button>
  <span style="color:var(--text-muted);font-size:calc(var(--font-base) - 1px)">共 ${data.count} 条</span>
</div>
<table>
<thead><tr><th>时间</th><th>操作类型</th><th>级别</th><th>消息</th></tr></thead>
<tbody>${rows || '<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">暂无日志</td></tr>'}</tbody>
</table>`;

  document.getElementById('logs-refresh').addEventListener('click', () => router());
}

// Render: Config（左侧导航 + 子页面）
// ============================================================
async function renderConfig(el, params) {
  const cfg = await api('/api/config');
  const sub = params.sub || '';
  const isSubpage = ['config', 'openlist', 'about', 'help'].includes(sub);
  const sections = {
    config: _renderConfigContent(cfg),
    openlist: '<div class="loading"><div class="spinner"></div> 加载中...</div>',
    about: _renderConfigAbout(),
    help: _renderConfigHelp(),
  };
  const buttons = [
    { id: 'config', label: 'WebUI/TMDB' },
    { id: 'openlist', label: 'OpenList' },
    { id: 'about', label: '关于' },
    { id: 'help', label: '帮助' },
  ];
  const arrow = '<svg class="upload-arrow" viewBox="0 -960 960 960" width="28" height="28" fill="currentColor"><path d="M440-320v-326L336-542l-56-58 200-200 200 200-56 58-104-104v326h-80ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/></svg>';
  let html = '';
  if (!isSubpage) {
    html += `<div class="config-entrance" id="config-entrance">`;
    buttons.forEach(btn => {
      html += `<button class="config-entrance-btn" data-sub="${btn.id}">${esc(btn.label)}${arrow}</button>`;
    });
    html += `</div>`;
  }
  html += `<div class="config-subpage${isSubpage ? ' active' : ''}" id="config-subpage">`;
  if (isSubpage) {
    html += `<button class="config-back-btn" id="config-back-btn">${icon('back')} 返回</button>`;
    html += sections[sub];
  }
  html += `</div>`;
  el.innerHTML = html;
  // Entrance fade-in on return from subpage
  const entrance = document.getElementById('config-entrance');
  if (entrance && sessionStorage.getItem('_config_back')) {
    entrance.classList.add('fade-in');
    sessionStorage.removeItem('_config_back');
  }
  // Entrance buttons: fade-out then navigate
  document.querySelectorAll('.config-entrance-btn').forEach(btn => btn.addEventListener('click', () => {
    if (!entrance) return navigate(`#config?sub=${btn.dataset.sub}`);
    entrance.classList.add('fade-out');
    const go = () => navigate(`#config?sub=${btn.dataset.sub}`);
    entrance.addEventListener('animationend', go, {once: true});
    setTimeout(go, 300); // fallback if animationend doesn't fire
  }));
  // Back button: exit subpage, then navigate
  const backBtn = document.getElementById('config-back-btn');
  if (backBtn) backBtn.addEventListener('click', () => {
    const subpage = document.getElementById('config-subpage');
    if (!subpage) return navigate('#config');
    subpage.classList.add('exiting');
    const go = () => { sessionStorage.setItem('_config_back', '1'); navigate('#config'); };
    subpage.addEventListener('animationend', go, {once: true});
    setTimeout(go, 350); // fallback if animationend doesn't fire
  });
  if (sub === 'config') _bindConfigFormEvents(cfg);
  if (sub === 'openlist') _renderOpenListConfig(el, cfg);
}

function _renderConfigContent(cfg) {
  function section(titleIcon, title, rowsHtml) {
    return `<div class="config-section"><h3>${icon(titleIcon)} ${esc(title)}</h3>${rowsHtml}</div>`;
  }

  function field(id, label, value, placeholder, type = 'text', persistLabel = false, readOnly = false) {
    const hasValue = value !== null && value !== undefined && String(value).trim() !== '';
    const inputClass = hasValue ? 'has-value' : '';
    const inputValue = esc(value || '');
    const floated = hasValue || persistLabel;
    const labelCls = floated
      ? `floating-label is-shown is-floating${hasValue ? ' is-filled' : ''}`
      : 'floating-label';
    const persistAttr = persistLabel ? ' data-persist-label="1"' : '';
    const disabledAttr = readOnly ? ' disabled' : '';
    const roClass = readOnly ? ' readonly-field' : '';
    return `
      <div class="floating-field" data-field="${id}">
        <div class="field-control">
          <label class="${labelCls}" data-role="label" for="${id}">${esc(label)}</label>
          <input type="${type}" id="${id}" class="${inputClass}${roClass}"${persistAttr}${disabledAttr} placeholder="${esc(placeholder || label)}" value="${inputValue}">
        </div>
      </div>`;
  }

  const presetLangs = ['zh-CN', 'en-US', 'ja-JP'];
  const savedLang = String(cfg.tmdb_language || 'zh-CN');
  const isCustomLang = !presetLangs.includes(savedLang);
  const langSelectValue = isCustomLang ? 'custom' : savedLang;
  const languageOptions = [
    ['zh-CN', '中文'],
    ['en-US', '英语'],
    ['ja-JP', '日语'],
    ['custom', '自定义'],
  ].map(([val, text]) => `<option value="${val}" ${langSelectValue === val ? 'selected' : ''}>${esc(text)}</option>`).join('');

  let html = `<div class="config-blocks-wrapper">`;
  html += `<div class="config-blocks-row">`;
  html += section('database', 'Bridge数据库', `
    <div class="config-row"><span class="key">路径</span><span class="val">${esc(cfg.db_file.replace(/^.*[\\\/]/, ''))}</span></div>
    <div class="config-row"><span class="key">存在</span><span class="val">${cfg.db_exists ? icon('check') : icon('error')}</span></div>
  `);
  const webuiRows = [];
  webuiRows.push(`<div class="config-row"><span class="key">端口</span><span class="val">${esc(cfg.webui_port)}</span></div>`);
  webuiRows.push(`<div class="config-row"><span class="key">绑定</span><span class="val">${esc(cfg.webui_bind)}</span></div>`);
  html += section('globe', 'WebUI', webuiRows.join(''));
  html += `</div>`;

  const tokenValue = cfg.tmdb_token || '';
  const apiKeyValue = cfg.tmdb_api_key || '';
  const hostValue = cfg.tmdb_host || '';
  const proxyValue = cfg.tmdb_proxy || cfg.tmdb_proxy_http || '';
  const watchlistDbValue = cfg.tmdb_watchlist_db || '';

  const langLabelCls = 'floating-label is-shown is-floating is-filled';
  const langCustomValue = isCustomLang ? savedLang : '';
  const langField = `
    <div class="floating-field" data-field="cfg-tmdb-lang">
      <div class="field-control">
        <label class="${langLabelCls}" data-role="label" for="cfg-tmdb-lang-select">语言</label>
        <div class="field-select-wrap${isCustomLang ? ' has-custom' : ''}">
          <select id="cfg-tmdb-lang-select" class="has-value">
            ${languageOptions}
          </select>
          <input type="text" id="cfg-tmdb-lang" placeholder="输入语言代码" value="${esc(langCustomValue)}" style="${isCustomLang ? '' : 'display:none'}">
        </div>
      </div>
    </div>`;

  const statusValue = cfg.tmdb_configured ? '已配置' : '未配置';
  const tmdbWatchlistEnabled = cfg.tmdb_watchlist_enabled !== 'false';  // 默认启用
  html += `<div class="config-section tmdb-section"><h3>${icon('tmdb')} TMDB <span style="font-size:calc(var(--font-base) - 1px);color:var(--text-muted);font-weight:400">(保存后即时生效，不需重启)</span></h3>`;
  html += `<div class="field-grid">`;
  html += `<div class="floating-field" data-field="cfg-tmdb-status">
    <div class="field-control">
      <label class="floating-label is-shown is-floating" data-role="label">状态</label>
      <div class="toggle-switch-container">
        <label class="toggle-switch">
          <input type="checkbox" id="cfg-tmdb-watchlist-enabled" ${tmdbWatchlistEnabled ? 'checked' : ''}>
          <span class="toggle-slider"></span>
          <span class="toggle-label">${tmdbWatchlistEnabled ? '已启用' : '已禁用'}</span>
        </label>
      </div>
    </div>
  </div>`;
  html += field('cfg-tmdb-account', 'account_id', cfg.tmdb_account_id || '未获取', '', 'text', true, true);
  html += field('cfg-tmdb-token', 'Access Token', tokenValue, '输入 TMDB Access Token', 'password');
  html += field('cfg-tmdb-apikey', 'API Key', apiKeyValue, '输入 TMDB API Key', 'password');
  html += langField;
  html += field('cfg-tmdb-host', '反代 Host', hostValue, '留空则使用官方 API');
  html += field('cfg-tmdb-proxy', 'HTTP 代理', proxyValue, '例: http://127.0.0.1:7890', 'text', true);
  html += field('cfg-tmdb-wldb', 'Watchlist DB', watchlistDbValue, '留空默认 tmdb_watchlist.db', 'text', true);
  html += `</div>`;
  html += `<div class="config-form-actions"><button class="toolbar-btn primary" id="cfg-tmdb-save">${icon('check')} 保存 TMDB 配置</button><button class="toolbar-btn" id="cfg-tmdb-refresh">${icon('refresh')} 刷新待看列表</button><button class="toolbar-btn" id="cfg-tmdb-match-refresh" style="background:color-mix(in srgb,var(--primary) 15%,var(--bg-card));border-color:color-mix(in srgb,var(--primary) 30%,var(--border-color))">${icon('check')} 刷新收录状态</button><button class="toolbar-btn secondary" id="cfg-tmdb-restart" style="color:#e37400;border-color:#e37400">${icon('refresh')} 重启 WebUI</button></div>`;
  html += `<div class="toggle-row"><span>关闭全屏 TMDB 缓存过期提醒</span><label class="switch-label" data-key="tmdb_cache_never_remind"><span class="switch-track"><span class="switch-thumb"></span></span></label></div>`;
  html += `<div class="toggle-row"><span>关闭右上角“建议刷新列表”提醒</span><label class="switch-label" data-key="tmdb_match_toast_disabled"><span class="switch-track"><span class="switch-thumb"></span></span></label></div>`;
  html += '</div>';
  html += '</div>';
  return html;
}

let _openlistStrmEngines = [];  // 从 API 获取的引擎列表
let _openlistApiStatus = 'checking';  // online/offline/unconfigured/auth_failed/checking

// Global tooltip help icon — used by both initial render and _refreshEngineTable
function _olHelpIcon(key, tooltipBelow = false) {
  // Convert kebab-case to snake_case (e.g., webdav-host -> webdav_host)
  const snakeKey = key.replace(/-/g, '_');
  const text = _openlistHelpTexts[snakeKey];
  if (!text) return '';
  const safeText = esc(text).replace(/"/g, '&quot;');
  const belowClass = tooltipBelow ? ' tooltip-below' : '';
  return `<span class="ol-help-icon${belowClass}" data-tooltip="${safeText}" aria-label="帮助">${icon('info')}</span>`;
}

async function _renderOpenListConfig(el, cfg) {
  // Load existing openlist config from DB
  let openlistCfg = {};
  try {
    const resp = await api('/api/webui/config/openlist');
    if (resp.success && resp.config) openlistCfg = resp.config;
  } catch(e) { /* ignore */ }

  // Load STRM engines from API
  try {
    const engResp = await api('/api/openlist/strm-engines');
    if (engResp.success) _openlistStrmEngines = engResp.engines || [];
  } catch(e) { _openlistStrmEngines = []; }

  // Parse strm_engines from DB (JSON array) — uses global strmEngines
  strmEngines = [];
  try {
    if (openlistCfg.strm_engines) strmEngines = JSON.parse(openlistCfg.strm_engines);
  } catch(e) { strmEngines = []; }
  if (!strmEngines.length) strmEngines = [{engine: '', monitored_paths: []}];

  // Parse refresh_paths
  let refreshPaths = [];
  try {
    if (openlistCfg.refresh_paths) refreshPaths = JSON.parse(openlistCfg.refresh_paths);
  } catch(e) { refreshPaths = []; }

  // Derive refresh paths from strmEngines (auto-fill from monitored_paths)
  // If DB has saved refresh_paths, use those; otherwise derive from strmEngines
  if (!refreshPaths.length && strmEngines.length) {
    const derived = new Set();
    strmEngines.forEach(row => {
      if (row.monitored_paths) row.monitored_paths.forEach(p => derived.add(p));
    });
    refreshPaths = Array.from(derived);
  }
  // Store in a global so tag area can update
  window._openlistRefreshPaths = refreshPaths.slice();

  function olField(id, label, value, placeholder, type = 'text', persistLabel = false, readOnly = false) {
    const hasValue = value !== null && value !== undefined && String(value).trim() !== '';
    const inputClass = hasValue ? 'has-value' : '';
    const inputValue = esc(value || '');
    const floated = hasValue || persistLabel;
    const labelCls = floated
      ? `floating-label is-shown is-floating${hasValue ? ' is-filled' : ''}`
      : 'floating-label';
    const persistAttr = persistLabel ? ' data-persist-label="1"' : '';
    const disabledAttr = readOnly ? ' disabled' : '';
    const roClass = readOnly ? ' readonly-field' : '';
    return `
      <div class="floating-field" data-field="${id}">
        <div class="field-control">
          <label class="${labelCls}" data-role="label" for="${id}">${esc(label)}${_olHelpIcon(id.replace(/^ol-/, ''))}</label>
          <input type="${type}" id="${id}" class="${inputClass}${roClass}"${persistAttr}${disabledAttr} placeholder="${esc(placeholder || label)}" value="${inputValue}">
        </div>
      </div>`;
  }

  // Select field helper (floating style)
  function olSelect(id, label, value, options, persistLabel = false) {
    // options: array of {value, label}
    const hasValue = value !== null && value !== undefined && String(value).trim() !== '';
    const floated = hasValue || persistLabel;
    const labelCls = floated
      ? `floating-label is-shown is-floating${hasValue ? ' is-filled' : ''}`
      : 'floating-label';
    const persistAttr = persistLabel ? ' data-persist-label="1"' : '';
    let optsHtml = options.map(o => {
      const selected = o.value === value ? ' selected' : '';
      return `<option value="${esc(o.value)}"${selected}>${esc(o.label)}</option>`;
    }).join('');
    return `
      <div class="floating-field" data-field="${id}">
        <div class="field-control">
          <label class="${labelCls}" data-role="label" for="${id}">${esc(label)}${_olHelpIcon(id.replace(/^ol-/, ''))}</label>
          <select id="${id}" class="ol-select"${persistAttr}>${optsHtml}</select>
        </div>
      </div>`;
  }

  function olToggle(id, label, checked) {
    return `<div class="toggle-row">
      <span>${esc(label)}${_olHelpIcon(id.replace(/^ol-/, ''))}</span>
      <label class="switch-label${checked ? ' on' : ''}" data-key="${id}" id="${id}">
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
    </div>`;
  }

  // Build engine table rows
  function buildEngineTable() {
    let html = '<table class="strm-engine-table"><thead><tr><th style="width:35%">STRM 引擎入口</th><th>监控目录' + _olHelpIcon('monitored_paths', true) + '</th><th style="width:60px">操作</th></tr></thead><tbody>';
    strmEngines.forEach((row, idx) => {
      html += buildEngineRow(idx, row, strmEngines.length);
    });
    html += '</tbody></table>';
    const addDisabled = _openlistApiStatus !== 'online' ? ' disabled' : '';
    html += `<div class="table-actions">
      <button class="table-btn primary" id="add-engine-row"${addDisabled}>+ 添加行</button>
    </div>`;
    return html;
  }

  function buildEngineRow(idx, row, totalRows) {
    // Engine dropdown
    let engineOptions = '<option value="">选择引擎...</option>';
    _openlistStrmEngines.forEach(eng => {
      const selected = row.engine === eng.mount_path ? ' selected' : '';
      engineOptions += `<option value="${esc(eng.mount_path)}"${selected}>${esc(eng.mount_path)}</option>`;
    });
    const disabledAttr = _openlistApiStatus !== 'online' ? ' disabled' : '';

    // Monitored paths as tags
    let tagsHtml = '';
    if (row.monitored_paths && row.monitored_paths.length) {
      row.monitored_paths.forEach((p, pi) => {
        tagsHtml += `<span class="tag">${esc(p)}<button class="tag-remove" data-row="${idx}" data-pi="${pi}" title="删除">×</button></span>`;
      });
    }

    const deleteDisabled = totalRows <= 1 ? ' disabled' : '';

    return `<tr data-row-idx="${idx}">
      <td>
        <select class="engine-select" data-row="${idx}"${disabledAttr}>
          ${engineOptions}
        </select>
      </td>
      <td>
        <div class="tag-container" data-row="${idx}" id="tag-container-${idx}">
          ${tagsHtml || '<span style="color:var(--text-muted);font-size:calc(var(--font-base) - 1px)">选择引擎后自动填充</span>'}
        </div>
      </td>
      <td style="text-align:center">
        <button class="table-btn danger" data-delete-row="${idx}"${deleteDisabled} title="删除此行">删除</button>
      </td>
    </tr>`;
  }

  // Build the full page
  let html = `<div class="openlist-form">`;
  
  // Group 1: Connection (full width)
