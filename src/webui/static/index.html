// Render refresh paths as tags (derived from strmEngines)
function _renderRefreshPathsTags() {
  const container = document.getElementById('refresh-paths-tags');
  if (!container) return;
  const paths = window._openlistRefreshPaths || [];
  if (!paths.length) {
    container.innerHTML = '<span class="refresh-paths-empty">暂无刷新路径，选择 STRM 引擎后自动填充</span>';
    return;
  }
  container.innerHTML = paths.map((p, i) => 
    `<span class="tag">${esc(p)}<button class="tag-remove" data-path-idx="${i}" title="删除">×</button></span>`
  ).join('');
  // Event delegation: single listener on container handles all tag-remove clicks
  if (!container._delegatedListener) {
    container._delegatedListener = (e) => {
      const btn = e.target.closest('.tag-remove');
      if (!btn || !container.contains(btn)) return;
      const idx = parseInt(btn.dataset.pathIdx);
      const path = window._openlistRefreshPaths && window._openlistRefreshPaths[idx];
      if (path === undefined) return;
      // Remove from all engines' monitored_paths so re-derivation won't restore it
      strmEngines.forEach(row => {
        if (row.monitored_paths) {
          let i = row.monitored_paths.indexOf(path);
          while (i !== -1) {
            row.monitored_paths.splice(i, 1);
            i = row.monitored_paths.indexOf(path);
          }
        }
      });
      _updateRefreshPathsFromEngines();
      _refreshEngineTable();
    };
    container.addEventListener('click', container._delegatedListener);
  }
}

// Update refresh paths from strmEngines (called when engine table changes)
function _updateRefreshPathsFromEngines() {
  const derived = new Set();
  strmEngines.forEach(row => {
    if (row.monitored_paths) row.monitored_paths.forEach(p => derived.add(p));
  });
  window._openlistRefreshPaths = Array.from(derived);
  _renderRefreshPathsTags();
}

function _bindOpenListFormEvents(cfg, openlistCfg) {
  // Floating label sync
  document.querySelectorAll('.openlist-form .floating-field input, .openlist-form .floating-field select').forEach(elm => {
    const wrapper = elm.closest('.floating-field');
    const label = wrapper && wrapper.querySelector('.floating-label');
    if (!label) return;
    const sync = () => {
      const hv = String(elm.value || '').trim() !== '';
      const focused = document.activeElement === elm;
      const persist = elm.dataset.persistLabel === '1';
      label.classList.toggle('is-shown', hv || focused || persist);
      label.classList.toggle('is-floating', hv || focused || persist);
      label.classList.toggle('is-filled', (hv || persist) && !focused);
      elm.classList.toggle('has-value', hv);
    };
    elm.addEventListener('focus', sync);
    elm.addEventListener('blur', sync);
    elm.addEventListener('input', sync);
    sync();
  });

  // Password fields: show plaintext when focused
  const passwordFields = ['ol-webdav-password', 'ol-webdav-totp'];
  passwordFields.forEach(id => {
    const input = document.getElementById(id);
    if (input) {
      input.addEventListener('focus', function() { this.type = 'text'; });
      input.addEventListener('blur', function() { this.type = 'password'; });
    }
  });

  // Toggle switches
  const toggleSwitch = (id) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', () => { el.classList.toggle('on'); });
  };
  toggleSwitch('ol-refresh-enabled');
  toggleSwitch('ol-sync-startup');

  // Test connection button
  document.getElementById('ol-test-connection')?.addEventListener('click', async () => {
    const btn = document.getElementById('ol-test-connection');
    btn.disabled = true;
    btn.innerHTML = '测试中...';
    try {
      const resp = await fetch('/api/openlist/test-connection', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          host: document.getElementById('ol-webdav-host')?.value || '',
          user: document.getElementById('ol-webdav-user')?.value || '',
          password: document.getElementById('ol-webdav-password')?.value || '',
          totp_secret: document.getElementById('ol-webdav-totp')?.value || '',
        }),
      });
      const data = await resp.json();
      if (data.success) {
        showToast('连接成功！', 'success');
        _openlistApiStatus = 'online';
        _updateApiStatusDot();
        // Refresh engine list
        try {
          const engResp = await api('/api/openlist/strm-engines');
          if (engResp.success) _openlistStrmEngines = engResp.engines || [];
        } catch(e) {}
        // Enable engine dropdowns and add-row button
        document.querySelectorAll('.engine-select').forEach(s => s.disabled = false);
        const addBtn = document.getElementById('add-engine-row');
        if (addBtn) addBtn.disabled = false;
      } else {
        // 根据错误类型设置不同的状态
        const errType = data.error_type || 'unknown';
        const statusMap = {
          'wrong_password': 'auth_failed_password',
          'wrong_2fa': 'auth_failed_2fa',
          'account_not_found': 'auth_failed',
          'network_error': 'offline',
          'exception': 'offline',
        };
        _openlistApiStatus = statusMap[errType] || 'auth_failed';
        _updateApiStatusDot();
        showToast('连接失败: ' + (data.error || '未知错误'), 'error');
        // Disable engine dropdowns and add-row button
        document.querySelectorAll('.engine-select').forEach(s => s.disabled = true);
        const addBtn = document.getElementById('add-engine-row');
        if (addBtn) addBtn.disabled = true;
      }
    } catch(e) {
      showToast('测试失败: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = `测试连接`;
    }
  });

  // Restart WebUI button
  document.getElementById('ol-restart-webui')?.addEventListener('click', async () => {
    if (!confirm('确定要重启 WebUI 主程序吗？\n\n重启期间 WebUI 将短暂不可用（约 2-3 秒），后台服务（监控和刷新任务）不受影响。')) {
      return;
    }
    const btn = document.getElementById('ol-restart-webui');
    btn.disabled = true;
    btn.innerHTML = '重启中...';
    showToast('正在重启 WebUI，请稍候...', 'info');
    try {
      const resp = await fetch('/api/restart-webui', { method: 'POST' });
      const data = await resp.json();
      if (data.success) {
        showToast('WebUI 正在重启，请稍候刷新页面...', 'success');
        // 等待 3 秒后自动刷新页面
        setTimeout(() => {
          window.location.reload();
        }, 3000);
      } else {
        showToast('重启失败: ' + (data.message || '未知错误'), 'error');
        btn.disabled = false;
        btn.innerHTML = `${icon('refresh')} 重启主程序`;
      }
    } catch(e) {
      showToast('重启请求失败: ' + e.message, 'error');
      btn.disabled = false;
      btn.innerHTML = `${icon('refresh')} 重启主程序`;
    }
  });

  // Engine select change → auto-fill monitored paths
  document.querySelectorAll('.engine-select').forEach(sel => {
    sel.addEventListener('change', async () => {
      const idx = parseInt(sel.dataset.row);
      const mountPath = sel.value;
      if (!mountPath) return;
      // Find matching engine
      const eng = _openlistStrmEngines.find(e => e.mount_path === mountPath);
      if (eng) {
        strmEngines[idx] = {engine: mountPath, monitored_paths: eng.paths || []};
        _refreshEngineRow(idx);
        _updateRefreshPathsFromEngines();
      } else {
        // Fetch monitored paths from API
        try {
          const resp = await api(`/api/openlist/monitored-paths?engine=${encodeURIComponent(mountPath)}`);
          if (resp.success) {
            strmEngines[idx] = {engine: mountPath, monitored_paths: resp.paths || []};
            _refreshEngineRow(idx);
            _updateRefreshPathsFromEngines();
          }
        } catch(e) {}
      }
    });
  });

  // Tag remove buttons — use event delegation on the table wrapper
  // so the same listener works for both initial render and refreshed tables
  const engineTableWrap = document.getElementById('strm-engine-table-wrap');
  if (engineTableWrap && !engineTableWrap._delegatedTagRemoveListener) {
    engineTableWrap._delegatedTagRemoveListener = (e) => {
      const btn = e.target.closest('.tag-remove');
      if (!btn || !engineTableWrap.contains(btn)) return;
      const ri = parseInt(btn.dataset.row);
      const pi = parseInt(btn.dataset.pi);
      if (strmEngines[ri] && strmEngines[ri].monitored_paths) {
        strmEngines[ri].monitored_paths.splice(pi, 1);
        _refreshEngineRow(ri);
        _updateRefreshPathsFromEngines();
      }
    };
    engineTableWrap.addEventListener('click', engineTableWrap._delegatedTagRemoveListener);
  }

  // Delete row buttons
  document.querySelectorAll('[data-delete-row]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.deleteRow);
      if (strmEngines.length <= 1) return;
      strmEngines.splice(idx, 1);
      _refreshEngineTable();
      _updateRefreshPathsFromEngines();
    });
  });

  // Add row button
  document.getElementById('add-engine-row')?.addEventListener('click', () => {
    strmEngines.push({engine: '', monitored_paths: []});
    _refreshEngineTable();
  });

  // Save button
  document.getElementById('ol-save')?.addEventListener('click', async () => {
    const btn = document.getElementById('ol-save');
    btn.disabled = true;
    btn.innerHTML = '保存中...';
    try {
      const body = {
        webdav_host: document.getElementById('ol-webdav-host')?.value || '',
        webdav_user: document.getElementById('ol-webdav-user')?.value || '',
        webdav_password: document.getElementById('ol-webdav-password')?.value || '',
        webdav_totp_secret: document.getElementById('ol-webdav-totp')?.value || '',
        b_root: document.getElementById('ol-b-root')?.value || '',
        c_root: document.getElementById('ol-c-root')?.value || '',
        refresh_paths: JSON.stringify(window._openlistRefreshPaths || []),
        strm_engines: JSON.stringify(strmEngines),
        refresh_enabled: document.getElementById('ol-refresh-enabled')?.classList.contains('on') ? 'true' : 'false',
        refresh_interval_minutes: document.getElementById('ol-refresh-interval')?.value || '10',
        refresh_depth: document.getElementById('ol-refresh-depth')?.value || '5',
        behavior_action: document.getElementById('ol-action')?.value || 'MOVE',
        behavior_trash_dir_name: document.getElementById('ol-trash-dir')?.value || 'trash',
        behavior_ghost_protect_seconds: document.getElementById('ol-ghost-protect')?.value || '300',
        behavior_a_to_b_restore_delay_seconds: document.getElementById('ol-restore-delay')?.value || '30',
        behavior_sync_on_startup: document.getElementById('ol-sync-startup')?.classList.contains('on') ? 'true' : 'false',
        behavior_sync_on_startup_wait: document.getElementById('ol-startup-wait')?.value || '0',
        log_level: document.getElementById('ol-log-level')?.value || 'INFO',
        log_max_size_mb: document.getElementById('ol-log-max-size')?.value || '2',
        log_backup_count: document.getElementById('ol-log-backup-count')?.value || '5',
      };
      const resp = await fetch('/api/webui/config/openlist', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
      });
      const data = await resp.json();
      if (data.success) {
        showToast('OpenList 配置已保存并热更新', 'success');
      } else {
        showToast('保存失败: ' + (data.error || '未知错误'), 'error');
      }
    } catch(e) {
      showToast('保存失败: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = `保存`;
    }
  });
}

// Make strmEngines accessible to event handlers
let strmEngines = [{engine: '', monitored_paths: []}];

function _refreshEngineRow(idx) {
  const container = document.getElementById(`tag-container-${idx}`);
  if (!container) return;
  const row = strmEngines[idx];
  if (!row || !row.monitored_paths || !row.monitored_paths.length) {
    container.innerHTML = '<span style="color:var(--text-muted);font-size:calc(var(--font-base) - 1px)">选择引擎后自动填充</span>';
    return;
  }
  container.innerHTML = row.monitored_paths.map((p, pi) => 
    `<span class="tag">${esc(p)}<button class="tag-remove" data-row="${idx}" data-pi="${pi}" title="删除">×</button></span>`
  ).join('');
  // Event delegation: single listener on container handles all tag-remove clicks
  // (Listener is attached once in _refreshEngineTable, no need to re-bind here)
}

function _refreshEngineTable() {
  const wrap = document.getElementById('strm-engine-table-wrap');
  if (!wrap) return;
  let html = `<table class="strm-engine-table"><thead><tr><th style="width:35%">STRM 引擎入口</th><th>监控目录${_olHelpIcon('monitored_paths', true)}</th><th style="width:60px">操作</th></tr></thead><tbody>`;
  strmEngines.forEach((row, idx) => {
    let engineOptions = '<option value="">选择引擎...</option>';
    _openlistStrmEngines.forEach(eng => {
      const selected = row.engine === eng.mount_path ? ' selected' : '';
      engineOptions += `<option value="${esc(eng.mount_path)}"${selected}>${esc(eng.mount_path)}</option>`;
    });
    const disabledAttr = _openlistApiStatus !== 'online' ? ' disabled' : '';
    let tagsHtml = '';
    if (row.monitored_paths && row.monitored_paths.length) {
      row.monitored_paths.forEach((p, pi) => {
        tagsHtml += `<span class="tag">${esc(p)}<button class="tag-remove" data-row="${idx}" data-pi="${pi}" title="删除">×</button></span>`;
      });
    }
    const deleteDisabled = strmEngines.length <= 1 ? ' disabled' : '';
    html += `<tr data-row-idx="${idx}">
      <td><select class="engine-select" data-row="${idx}"${disabledAttr}>${engineOptions}</select></td>
      <td><div class="tag-container" data-row="${idx}" id="tag-container-${idx}">${tagsHtml || '<span style="color:var(--text-muted);font-size:calc(var(--font-base) - 1px)">选择引擎后自动填充</span>'}</div></td>
      <td style="text-align:center"><button class="table-btn danger" data-delete-row="${idx}"${deleteDisabled} title="删除此行">删除</button></td>
    </tr>`;
  });
  html += '</tbody></table>';
  const addDisabled = _openlistApiStatus !== 'online' ? ' disabled' : '';
  html += `<div class="table-actions"><button class="table-btn primary" id="add-engine-row"${addDisabled}>+ 添加行</button></div>`;
  wrap.innerHTML = html;

  // Engine select change → auto-fill monitored paths
  wrap.querySelectorAll('.engine-select').forEach(sel => {
    sel.addEventListener('change', async () => {
      const idx = parseInt(sel.dataset.row);
      const mountPath = sel.value;
      if (!mountPath) return;
      const eng = _openlistStrmEngines.find(e => e.mount_path === mountPath);
      if (eng) {
        strmEngines[idx] = {engine: mountPath, monitored_paths: eng.paths || []};
        _refreshEngineRow(idx);
        _updateRefreshPathsFromEngines();
      } else {
        try {
          const resp = await api(`/api/openlist/monitored-paths?engine=${encodeURIComponent(mountPath)}`);
          if (resp.success) {
            strmEngines[idx] = {engine: mountPath, monitored_paths: resp.paths || []};
            _refreshEngineRow(idx);
            _updateRefreshPathsFromEngines();
          }
        } catch(e) {}
      }
    });
  });
  // Single delegated listener for all tag-remove clicks inside the table
  // Use a flag to prevent accumulating listeners on repeated calls
  if (!wrap._delegatedTagRemoveListener) {
    wrap._delegatedTagRemoveListener = (e) => {
      const btn = e.target.closest('.tag-remove');
      if (!btn || !wrap.contains(btn)) return;
      const ri = parseInt(btn.dataset.row);
      const pi = parseInt(btn.dataset.pi);
      if (strmEngines[ri] && strmEngines[ri].monitored_paths) {
        strmEngines[ri].monitored_paths.splice(pi, 1);
        _refreshEngineRow(ri);
        _updateRefreshPathsFromEngines();
      }
    };
    wrap.addEventListener('click', wrap._delegatedTagRemoveListener);
  }
  wrap.querySelectorAll('[data-delete-row]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.deleteRow);
      if (strmEngines.length <= 1) return;
      strmEngines.splice(idx, 1);
      _refreshEngineTable();
      _updateRefreshPathsFromEngines();
    });
  });
  document.getElementById('add-engine-row')?.addEventListener('click', () => {
    strmEngines.push({engine: '', monitored_paths: []});
    _refreshEngineTable();
  });
}

// API Status check
async function _checkApiStatus() {
  const dot = document.getElementById('api-status-dot');
  const text = document.getElementById('api-status-text');
  if (!dot || !text) return;
  dot.className = 'api-status-dot checking';
  text.textContent = 'OpenList 检查中';
  try {
    const resp = await api('/api/openlist/status');
    if (resp.status === 'online') {
      dot.className = 'api-status-dot online';
      text.textContent = 'OpenList 在线';
      _openlistApiStatus = 'online';
    } else if (resp.status === 'unconfigured') {
      dot.className = 'api-status-dot unconfigured';
      text.textContent = 'OpenList 未配置';
      _openlistApiStatus = 'unconfigured';
    } else if (resp.status === 'auth_failed_password') {
      dot.className = 'api-status-dot auth_failed';
      text.textContent = 'OpenList 密码错误';
      _openlistApiStatus = 'auth_failed_password';
    } else if (resp.status === 'auth_failed_2fa') {
      dot.className = 'api-status-dot auth_failed';
      text.textContent = 'OpenList 2FA 错误';
      _openlistApiStatus = 'auth_failed_2fa';
    } else if (resp.status === 'auth_failed') {
      dot.className = 'api-status-dot auth_failed';
      text.textContent = 'OpenList 认证失败';
      _openlistApiStatus = 'auth_failed';
    } else {
      dot.className = 'api-status-dot offline';
      text.textContent = 'OpenList 离线';
      _openlistApiStatus = resp.status || 'offline';
    }
  } catch(e) {
    dot.className = 'api-status-dot offline';
    text.textContent = 'OpenList 离线';
    _openlistApiStatus = 'offline';
  }
}

function _updateApiStatusDot() {
  const dot = document.getElementById('ol-status-dot');
  const text = document.getElementById('ol-status-text');
  if (dot) dot.className = `api-status-dot ${_openlistApiStatus}`;
  if (text) {
    const statusTextMap = {
      'online': 'OpenList 在线',
      'offline': 'OpenList 离线',
      'auth_failed': 'OpenList 认证失败',
      'auth_failed_password': 'OpenList 密码错误',
      'auth_failed_2fa': 'OpenList 2FA 错误',
      'unconfigured': 'OpenList 未配置',
    };
    text.textContent = statusTextMap[_openlistApiStatus] || 'OpenList 未配置';
  }
  // Also update global status indicator
  const globalDot = document.getElementById('api-status-dot');
  const globalText = document.getElementById('api-status-text');
  if (globalDot) globalDot.className = `api-status-dot ${_openlistApiStatus}`;
  if (globalText) {
    const statusTextMap = {
      'online': 'OpenList 在线',
      'offline': 'OpenList 离线',
      'auth_failed': 'OpenList 认证失败',
      'auth_failed_password': 'OpenList 密码错误',
      'auth_failed_2fa': 'OpenList 2FA 错误',
      'unconfigured': 'OpenList 未配置',
    };
    globalText.textContent = statusTextMap[_openlistApiStatus] || 'OpenList 未配置';
  }
}

async function _bindConfigFormEvents(cfg) {
  const tokenInput = document.getElementById('cfg-tmdb-token');
  const apiKeyInput = document.getElementById('cfg-tmdb-apikey');
  if (tokenInput) {
    tokenInput.addEventListener('focus', function(){ this.type = 'text'; });
    tokenInput.addEventListener('blur', function(){ this.type = 'password'; });
  }
  if (apiKeyInput) {
    apiKeyInput.addEventListener('focus', function(){ this.type = 'text'; });
    apiKeyInput.addEventListener('blur', function(){ this.type = 'password'; });
  }
  const bindSwitch = (el, key) => {
    if (!el) return;
    const sync = () => {
      const on = _getUiConfig(key);
      el.classList.toggle('on', on);
    };
    el.addEventListener('click', () => {
      const on = _getUiConfig(key);
      _setUiConfig(key, on ? '' : '1');
      sync();
    });
    sync();
  };
  bindSwitch(document.querySelector('.switch-label[data-key="tmdb_cache_never_remind"]'), 'tmdb_cache_never_remind');
  bindSwitch(document.querySelector('.switch-label[data-key="tmdb_match_toast_disabled"]'), 'tmdb_match_toast_disabled');

  // TMDB Watchlist enable/disable toggle (status field)
  const watchlistToggle = document.getElementById('cfg-tmdb-watchlist-enabled');
  if (watchlistToggle) {
    const updateToggleLabel = () => {
      const lbl = watchlistToggle.parentElement.querySelector('.toggle-label');
      if (lbl) lbl.textContent = watchlistToggle.checked ? '已启用' : '已禁用';
    };
    watchlistToggle.addEventListener('change', updateToggleLabel);
    updateToggleLabel();
  }

  const langSelect = document.getElementById('cfg-tmdb-lang-select');
  const langInput = document.getElementById('cfg-tmdb-lang');
  const langWrap = document.querySelector('[data-field="cfg-tmdb-lang"] .field-select-wrap');
  if (langSelect && langInput && langWrap) {
    const syncLang = () => {
      const isCustom = langSelect.value === 'custom';
      langWrap.classList.toggle('has-custom', isCustom);
      if (isCustom) {
        langInput.style.display = '';
        langInput.disabled = false;
        if (!langInput.value) langInput.value = '';
        langInput.focus();
      } else {
        langInput.style.display = 'none';
        langInput.disabled = true;
      }
    };
    langSelect.addEventListener('change', syncLang);
  }

  document.querySelectorAll('.floating-field input, .floating-field select').forEach(elm => {
    if (elm.id === 'cfg-tmdb-lang-select' || elm.id === 'cfg-tmdb-lang') return;
    const wrapper = elm.closest('.floating-field');
    const label = wrapper && wrapper.querySelector('.floating-label');
    if (!label) return;
    const sync = () => {
      const hv = String(elm.value || '').trim() !== '';
      const focused = document.activeElement === elm;
      const persist = elm.dataset.persistLabel === '1';
      label.classList.toggle('is-shown', hv || focused || persist);
      label.classList.toggle('is-floating', hv || focused || persist);
      label.classList.toggle('is-filled', (hv || persist) && !focused);
      elm.classList.toggle('has-value', hv);
    };
    elm.addEventListener('focus', sync);
    elm.addEventListener('blur', sync);
    elm.addEventListener('input', sync);
    sync();
  });

  document.getElementById('cfg-tmdb-save').addEventListener('click', async () => {
    const btn = document.getElementById('cfg-tmdb-save');
    btn.disabled = true;
    btn.innerHTML = '保存中...';
    try {
      const langChoice = document.getElementById('cfg-tmdb-lang-select').value;
      const langValue = langChoice === 'custom' ? (document.getElementById('cfg-tmdb-lang').value || 'zh-CN') : langChoice;
      const watchlistEnabled = document.getElementById('cfg-tmdb-watchlist-enabled')?.checked !== false;
      const body = {
        access_token: tokenInput.value,
        api_key: document.getElementById('cfg-tmdb-apikey').value,
        language: langValue,
        host: document.getElementById('cfg-tmdb-host').value,
        proxy_http: document.getElementById('cfg-tmdb-proxy').value,
        proxy_enabled: document.getElementById('cfg-tmdb-proxy').value.trim() !== '',
        watchlist_db: document.getElementById('cfg-tmdb-wldb').value,
        watchlist_enabled: watchlistEnabled ? 'true' : 'false',
      };
      const resp = await fetch('/api/tmdb/configure', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
      });
      const text = await resp.text();
      if (!resp.ok) {
        throw new Error(text || `HTTP ${resp.status}`);
      }
      let data;
      try {
        data = text ? JSON.parse(text) : {};
      } catch (parseError) {
        throw new Error(text || parseError.message);
      }
      if (data.success === false) {
        throw new Error(data.error || data.message || `HTTP ${resp.status}`);
      }
      showToast(data.message || '已保存', 'success');
    } catch(e) {
      showToast('保存失败: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = `${icon('check')} 保存 TMDB 配置`;
    }
  });

  document.getElementById('cfg-tmdb-refresh').addEventListener('click', async () => {
    const btn = document.getElementById('cfg-tmdb-refresh');
    btn.disabled = true;
    btn.innerHTML = '启动同步中...';
    try {
      const resp = await fetch('/api/tmdb/watchlist/sync', { method: 'POST' });
      const data = await resp.json();
      if (data.success) {
        showToast(data.message || '后台同步已启动', 'success');
        _tmdbCache.movies = null;
        _tmdbCache.tv = null;
      } else showToast(data.message || data.error || '同步失败', 'error');
    } catch(e) {
      showToast('同步失败: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = `${icon('refresh')} 刷新待看列表`;
    }
  });

  document.getElementById('cfg-tmdb-restart').addEventListener('click', async () => {
    const btn = document.getElementById('cfg-tmdb-restart');
    btn.disabled = true;
    btn.innerHTML = '重启中...';
    try {
      await fetch('/api/restart-webui', { method: 'POST' });
      showToast('WebUI 正在重启...', 'info');
    } catch(e) {
      showToast('重启失败: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = `${icon('refresh')} 重启 WebUI`;
    }
  });

  document.getElementById('cfg-tmdb-match-refresh').addEventListener('click', async () => {
    const btn = document.getElementById('cfg-tmdb-match-refresh');
    btn.disabled = true;
    btn.innerHTML = '启动刷新中...';
    try {
      const resp = await fetch('/api/tmdb/watchlist/match/refresh', { method: 'POST' });
      const data = await resp.json();
      if (data.success) {
        showToast(data.message || '后台收录状态刷新已启动', 'info');
        btn.innerHTML = '刷新中...';
        const maxPolls = 120;
        for (let i = 0; i < maxPolls; i++) {
          await new Promise(r => setTimeout(r, 1000));
          try {
            const st = await api('/api/tmdb/watchlist/match/status');
            if (!st.running && st.result) {
              const r = st.result;
              if (r.error) {
                showToast('收录状态刷新失败: ' + r.error, 'error');
              } else {
                showToast(`收录状态已刷新: ${r.matched} 已收录 / ${r.fuzzy} 待确认 / ${r.unmatched} 未收录 (共 ${r.total} 项)`, 'success');
                _tmdbCache.movies = null;
                _tmdbCache.tv = null;
              }
              break;
            }
          } catch(_) {}
        }
      } else {
        showToast(data.message || '启动刷新失败', 'error');
      }
    } catch(e) {
      showToast('刷新失败: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '刷新收录状态';
    }
  });
}

  // ============================================================
  // TMDB Watchlist Cache (client-side, 30min TTL)
  // ============================================================
const _tmdbCache = { movies: null, tv: null };
const _tmdbCacheTTL = 30 * 60 * 1000; // 30 minutes
const _fetchPromises = {}; // dedup concurrent all=1 fetches
let _tmdbWebBase = 'https://www.themoviedb.org'; // 从 /api/config 加载
let _uiConfig = {}; // 从 /api/webui/config/ui 加载（替代 localStorage 的 TMDB UI 偏好）

function _getCachedWatchlist(type) {
  const c = _tmdbCache[type];
  if (c && (Date.now() - c.ts) < _tmdbCacheTTL) return c.data;
  return null;
}
function _setCachedWatchlist(type, data) {
  _tmdbCache[type] = { data, ts: Date.now() };
}

// ============================================================
// UI Config Cache (替代 localStorage 的 TMDB UI 偏好)
// ============================================================
async function _loadUiConfig() {
  try {
    const resp = await fetch('/api/webui/config/ui');
    const data = await resp.json();
    if (data.success && data.config) _uiConfig = data.config;
  } catch(e) { /* ignore */ }
}
function _getUiConfig(key) {
  return _uiConfig[key] === '1';
}
function _setUiConfig(key, val) {
  _uiConfig[key] = val;
  fetch('/api/webui/config/ui', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({[key]: val})
  }).catch(() => {});
}

// ============================================================
// Uptime ticker (dashboard card)
// ============================================================
function updateUptime() {
  const el = document.getElementById('uptime-val');
  if (!el) return;
  if (_serverStartTime == null) {
    el.textContent = '-';
    return;
  }
  const sec = Math.floor((Date.now() - _serverStartTime) / 1000);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  el.textContent = `${h}h ${m}m ${s}s`;
}

// ============================================================
// Init
// ============================================================
window.addEventListener('hashchange', router);

document.addEventListener('DOMContentLoaded', () => {
  const root = document.documentElement;
  const savedSys = localStorage.getItem('webui_theme_system');
  const savedCol = localStorage.getItem('webui_theme_color');
  const savedFont = localStorage.getItem('webui_theme_fontsize');
  if (savedSys) root.dataset.system = savedSys;
  if (savedCol) root.dataset.color = savedCol;
  if (savedFont && ['lg','sm','xs'].includes(savedFont)) root.dataset.font = savedFont;
  syncTheme();
  initDropdowns();

  // Load UI config from DB (替代 localStorage 的 TMDB UI 偏好)
  _loadUiConfig();

  // Load TMDB web base from config
  fetch('/api/config').then(r => r.json()).then(cfg => {
    _tmdbWebBase = cfg.tmdb_host && !cfg.tmdb_host.startsWith('https://api.themoviedb.org')
      ? cfg.tmdb_host : 'https://www.themoviedb.org';
  }).catch(() => {});

  setInterval(updateUptime, 1000);

  // 初始化水墨晕染壁纸遮罩（独立脚本 wallpaper-reveal.js 已导出）
  if (typeof window.initWallpaperReveal === 'function') {
    window.initWallpaperReveal();
  }

  // Delay API status check to avoid blocking page render
  setTimeout(() => {
    _checkApiStatus();
  }, 0);

  router();
});
