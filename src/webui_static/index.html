<!DOCTYPE html>
<html lang="zh-CN" data-system="material" data-color="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STRM Bridge</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<style>
/* ===== CSS Variables & Themes ===== */
:root{
  --header-height:56px;
  --font-family:'Roboto',-apple-system,system-ui,sans-serif;
  --radius-card:16px;--radius-control:100px;--radius-pill:100px;
  --shadow-sm:0px 1px 3px 1px rgba(0,0,0,.15);
  --shadow-md:0px 2px 6px 2px rgba(0,0,0,.15);
  --border-color:#79747e;--text-main:#1d1b20;--text-muted:#49454f;
  --primary:#005faf;--primary-hover:#004581;--primary-light:#d4e3ff;--on-primary:#fff;
  --bg-page:#f8f9ff;--bg-card:#eceef5;--bg-control:#e0e2e9;
  --font-size-sm:13px;--font-size-xs:12px;
  --bg-surface:color-mix(in srgb,var(--bg-card) 88%,transparent);
  --bg-surface-soft:color-mix(in srgb,var(--bg-card) 70%,var(--bg-page));
  --bg-subtle:color-mix(in srgb,var(--bg-control) 74%,var(--bg-page));
  --surface-border:color-mix(in srgb,var(--border-color) 38%,transparent);
  --surface-border-strong:color-mix(in srgb,var(--border-color) 62%,transparent);
  --surface-hover:color-mix(in srgb,var(--primary) 10%,var(--bg-card));
}
:root[data-system="fluent"]{
  --font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
  --radius-card:8px;--radius-control:4px;--radius-pill:100px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 8px rgba(0,0,0,.12),0 0 2px rgba(0,0,0,.04);
  --bg-page:#fafafa;--bg-card:#fff;--bg-control:#fff;
  --border-color:#d1d1d1;--text-main:#242424;--text-muted:#616161;
  --bg-surface:rgba(255,255,255,.88);--bg-surface-soft:#fff;--bg-subtle:#f8f8f8;
  --surface-border:color-mix(in srgb,var(--border-color) 100%,transparent);
  --surface-border-strong:color-mix(in srgb,var(--border-color) 100%,transparent);
  --surface-hover:color-mix(in srgb,var(--primary) 8%,var(--bg-card));
}
:root[data-system="material"][data-color="blue"],:root[data-system="fluent"][data-color="blue"]{--primary:#005faf;--primary-hover:#004581;--primary-light:#d4e3ff;--on-primary:#fff}
:root[data-system="fluent"][data-color="purple"]{--primary:#8764b8;--primary-hover:#7252a1;--primary-light:#f4f0fa;--on-primary:#fff}
:root[data-system="fluent"][data-color="green"]{--primary:#107c41;--primary-hover:#0b5930;--primary-light:#e6f4ea;--on-primary:#fff}
:root[data-system="fluent"][data-color="orange"]{--primary:#d83b01;--primary-hover:#b83201;--primary-light:#fdf3eb;--on-primary:#fff}
:root[data-system="material"][data-color="purple"]{--primary:#6750a4;--primary-hover:#533d8a;--primary-light:#eaddff;--on-primary:#fff;--bg-page:#fdf7ff;--bg-card:#f3edf7;--bg-control:#e7e0ec}
:root[data-system="material"][data-color="green"]{--primary:#386a20;--primary-hover:#2c5418;--primary-light:#b7f397;--on-primary:#fff;--bg-page:#f7fbf1;--bg-card:#eef3e6;--bg-control:#e0e8d8}
:root[data-system="material"][data-color="orange"]{--primary:#8b5000;--primary-hover:#6e3d00;--primary-light:#ffdcbe;--on-primary:#fff;--bg-page:#fff8f5;--bg-card:#f9eee5;--bg-control:#eddcd1}

/* ===== Base ===== */
body{font-family:var(--font-family);font-size:var(--font-base,13px);background:var(--bg-page);color:var(--text-main);min-height:100vh;overflow-x:hidden;transition:background-color .2s ease,color .2s ease;margin:0}
#wallpaper-a,#wallpaper-b{position:fixed;top:var(--header-height);left:0;right:0;height:calc(100vh - var(--header-height));background-size:cover;background-position:center;background-repeat:no-repeat;z-index:-4;transition:opacity 1.5s ease-in-out,transform 8s ease-in-out;filter:saturate(1.05) brightness(.72) contrast(1.02);transform:scale(1.03)}
#wallpaper-a{opacity:1}
#wallpaper-b{opacity:0}
#wallpaper-info{position:fixed;bottom:8px;right:16px;font-size:11px;color:rgba(32,33,36,.55);z-index:10;pointer-events:none;background:color-mix(in srgb,var(--bg-card) 72%,transparent);border:1px solid color-mix(in srgb,var(--border-color) 18%,transparent);border-radius:999px;padding:6px 10px;box-shadow:0 8px 20px rgba(0,0,0,.08)}
#toast-container{position:fixed;top:70px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none}

/* ===== Header ===== */
header{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg-card) 85%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--border-color);padding:10px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:space-between}
header .brand{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--primary);letter-spacing:.3px;white-space:nowrap}
header .sub{font-size:11px;color:var(--text-muted);margin-left:4px;opacity:.6}
nav{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;flex:1}
nav a{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);text-decoration:none;padding:8px 14px;border-radius:var(--radius-pill);font-size:var(--font-base);font-weight:500;transition:all .2s;cursor:pointer}
nav a:hover{background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--primary)}
nav a.active{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);font-weight:600}
.theme-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;min-width:unset}
/* Dropdown */
.dropdown-wrap{position:relative}
.dropdown-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid color-mix(in srgb,var(--border-color) 30%,transparent);border-radius:var(--radius-control);padding:6px 10px;height:32px;background:color-mix(in srgb,var(--bg-card) 90%,transparent);color:var(--text-main);font-size:calc(var(--font-base) - 1px);font-weight:500;cursor:pointer;font-family:inherit;transition:background .18s,border-color .18s;white-space:nowrap;box-sizing:border-box;vertical-align:middle}
.dropdown-btn:hover{background:color-mix(in srgb,var(--primary) 10%,var(--bg-card))}
.dropdown-arrow{font-size:10px;opacity:.5}
.dropdown-menu{display:none;position:absolute;top:calc(100% + 4px);right:0;min-width:150px;background:var(--bg-card);border:1px solid color-mix(in srgb,var(--border-color) 30%,transparent);border-radius:var(--radius-card);box-shadow:0 4px 16px rgba(0,0,0,.14);z-index:100;overflow:hidden;padding:4px 0}
.dropdown-wrap.open .dropdown-menu{display:block}
.dropdown-item{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:calc(var(--font-base) - 1px);color:var(--text-main);cursor:pointer;transition:background .12s;white-space:nowrap}
.dropdown-item:hover{background:color-mix(in srgb,var(--primary) 10%,var(--bg-card))}
.dropdown-item.active{background:color-mix(in srgb,var(--primary) 14%,var(--bg-card));color:var(--primary);font-weight:600}
.color-dot{width:16px;height:16px;border-radius:50%;border:2px solid color-mix(in srgb,var(--border-color) 20%,transparent);flex-shrink:0}
.color-dot.cd-blue{background:#1a73e8}.color-dot.cd-purple{background:#7b1fa2}.color-dot.cd-green{background:#2e7d32}.color-dot.cd-orange{background:#e65100}
.color-dot-icon{width:18px;height:18px;border-radius:50%;display:block;flex-shrink:0;transition:background .2s}
.material-icon{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:16px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-smoothing:antialiased;font-feature-settings:'liga';display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;flex-shrink:0;color:currentColor;user-select:none;width:1em;overflow:hidden}
.material-icon.filled{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.material-icon{font-size:16px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;color:currentColor;flex-shrink:0;overflow:hidden;width:1em}
.material-icon.ui-icon-lg{font-size:22px}

/* Table font size */
tbody td{font-size:var(--font-base,13px)}
thead th{font-size:calc(var(--font-base,13px) - 1px)}
/* ===== Fluent 2 Header Override ===== */
:root[data-system="fluent"] header{background:var(--bg-card);backdrop-filter:none;border-bottom:1px solid var(--border-color);border-radius:0;padding:8px 16px}
:root[data-system="fluent"] nav a{border-radius:var(--radius-control);font-size:var(--font-base);padding:6px 12px}
:root[data-system="fluent"] nav a.active{background:var(--bg-subtle);box-shadow:inset 0 -2px 0 var(--primary)}
:root[data-system="fluent"] .media-card{border-radius:var(--radius-card);border:1px solid var(--border-color);background:var(--bg-card);position:relative;overflow:hidden}
:root[data-system="fluent"] .stat-card{border-radius:var(--radius-card)}
:root[data-system="fluent"] .toolbar{border-radius:var(--radius-card);border:1px solid var(--border-color)}
:root[data-system="fluent"] .page-shell,.root[data-system="fluent"] .page-card,.root[data-system="fluent"] .panel{border-radius:var(--radius-card)}
:root[data-system="fluent"] .category-tab{border-radius:var(--radius-control)}
:root[data-system="fluent"] .season-details{border-radius:var(--radius-card);border:1px solid var(--border-color);background:var(--bg-card)}
:root[data-system="fluent"] .season-details summary{background:var(--bg-subtle)}
:root[data-system="fluent"] .season-details[open]{box-shadow:var(--shadow-sm)}
:root[data-system="fluent"] table{border-radius:var(--radius-card);border:1px solid var(--border-color);background:var(--bg-card)}
:root[data-system="fluent"] thead th{background:var(--bg-subtle)}
:root[data-system="material"] .season-details{border-radius:18px}
:root[data-system="material"] table{border-radius:18px}
:root[data-system="fluent"] .config-section{border-radius:var(--radius-card)}
:root[data-system="fluent"] .log-panel{border-radius:var(--radius-card)}
:root[data-system="fluent"] .legend-badge{border-radius:var(--radius-control)}
:root[data-system="fluent"] .status-legend{border-radius:var(--radius-card)}
:root[data-system="fluent"] .tmdb-status-badge{border-radius:var(--radius-control)}
:root[data-system="fluent"] .media-grid{gap:10px}
:root[data-system="fluent"] .tmdb-grid{gap:18px 16px}
:root[data-system="fluent"] .stat-grid{gap:10px}
:root[data-system="fluent"] .dropdown-menu{border-radius:var(--radius-card);box-shadow:var(--shadow-md)}
:root[data-system="fluent"] .dropdown-item{border-radius:var(--radius-control);margin:2px 4px;padding:6px 12px}

/* ===== Container ===== */
.container{max-width:1440px;margin:0 auto;padding:20px}

/* ===== Cards & Panels ===== */
.page-shell,.page-card,.panel,.stat-card,.media-card,.toolbar,.season-details,table{background:color-mix(in srgb,var(--bg-card) 88%,transparent);border:1px solid color-mix(in srgb,var(--border-color) 18%,transparent);box-shadow:var(--shadow-sm);backdrop-filter:blur(12px)}
.page-shell,.page-card,.panel{border-radius:20px;padding:18px;margin-bottom:18px}
.page-shell>h2,.page-card>h2,.panel>h2{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:22px}

/* ===== Stat Grid ===== */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:18px 0}
.stat-card{border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-height:112px;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.stat-card:hover,.media-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:color-mix(in srgb,var(--primary) 32%,var(--border-color))}
.stat-card .label{font-size:calc(var(--font-base) - 1px);color:var(--text-muted);letter-spacing:.2px;display:flex;align-items:center;gap:6px}
.stat-card .value{font-size:28px;font-weight:800;color:var(--text-main);line-height:1}

/* ===== Toolbar ===== */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-radius:18px;margin:16px 0}
.toolbar input[type="text"],.search-input,.search-wrap input[type="text"]{flex:1 1 260px;min-width:220px;border-radius:var(--radius-control);border:1px solid color-mix(in srgb,var(--border-color) 34%,transparent);background:var(--bg-control);padding:10px 14px;color:var(--text-main);outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35);font-family:inherit;transition:border-color .18s,box-shadow .18s}
:root[data-system="material"] .toolbar input[type="text"],:root[data-system="material"] .search-input,:root[data-system="material"] .search-wrap input[type="text"]{border-radius:28px;padding:10px 18px;border:1px solid color-mix(in srgb,var(--border-color) 20%,transparent);background:color-mix(in srgb,var(--bg-card) 85%,transparent)}
:root[data-system="material"] .toolbar .search-wrap input[type="text"]{padding-left:40px}
:root[data-system="fluent"] .toolbar input[type="text"],:root[data-system="fluent"] .search-input{border-radius:var(--radius-control);padding:10px 14px}
:root[data-system="fluent"] .search-wrap input[type="text"]{border-radius:var(--radius-control);padding:10px 14px 10px 34px}
.toolbar input:focus,.search-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.toolbar-btn,.search-btn,.category-tab,.sort-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--radius-pill);padding:9px 14px;background:color-mix(in srgb,var(--primary) 12%,var(--bg-card));color:var(--primary);font-weight:600;cursor:pointer;transition:background .18s ease,transform .18s ease,color .18s ease,box-shadow .18s ease;text-decoration:none;font-family:inherit;font-size:var(--font-base);appearance:none;-webkit-appearance:none}
.toolbar-btn:hover,.category-tab:hover{background:color-mix(in srgb,var(--primary) 20%,var(--bg-card))}
.toolbar-btn.primary,.search-btn{background:var(--primary);color:var(--on-primary)}
.toolbar-btn.primary:hover,.search-btn:hover{background:var(--primary-hover);color:var(--on-primary)}
.toolbar-btn.primary:active,.search-btn:active{transform:scale(.97);background:var(--primary-hover)}
.toolbar-btn.secondary{background:color-mix(in srgb,var(--bg-control) 82%,var(--bg-card));color:var(--text-main);border:1px solid color-mix(in srgb,var(--border-color) 40%,transparent)}
.toolbar-btn.secondary:hover{background:color-mix(in srgb,var(--bg-control) 100%,var(--bg-card))}
.toolbar-btn:active{transform:translateY(0)}

/* MD3 button overrides — filled/tonal rounded */
:root[data-system="material"] .toolbar-btn,:root[data-system="material"] .search-btn,:root[data-system="material"] .category-tab{border-radius:20px;padding:8px 20px}
:root[data-system="material"] .toolbar-btn.primary,:root[data-system="material"] .search-btn{padding:10px 24px;border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.15)}

/* Fluent 2 button overrides — crisp accent/standard */
:root[data-system="fluent"] .toolbar-btn,:root[data-system="fluent"] .search-btn,:root[data-system="fluent"] .category-tab,:root[data-system="fluent"] .sort-btn{border-radius:var(--radius-control);padding:6px 14px;font-weight:500}
:root[data-system="fluent"] .toolbar-btn.primary,:root[data-system="fluent"] .search-btn{background:var(--primary);color:var(--on-primary);border:none;padding:8px 20px;font-weight:600}
:root[data-system="fluent"] .toolbar-btn.primary:hover,:root[data-system="fluent"] .search-btn:hover{background:var(--primary-hover)}
:root[data-system="fluent"] .toolbar-btn.secondary{background:var(--bg-card);color:var(--text-main);border:1px solid var(--border-color);box-shadow:none}
:root[data-system="fluent"] .toolbar-btn.secondary:hover{background:var(--bg-subtle)}

/* ===== Area Path Block (themed) ===== */
.area-detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-card);padding:12px 14px}
.area-path-block{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;user-select:text;flex:1 1 auto;min-width:0}
.area-path-block .path-line{display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:color-mix(in srgb,var(--primary) 12%,var(--bg-card));border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);border-radius:var(--radius-card);padding:8px 12px;font-size:calc(var(--font-base) - 1px);line-height:1.5;user-select:text}
.area-path-block .path-label{color:var(--primary);font-weight:600;white-space:nowrap}
.area-path-block .path-value{color:var(--text-main);word-break:break-all;white-space:normal}
.area-detail-head .detail-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.area-detail-head .detail-actions .toolbar-btn{display:inline-flex;align-items:center;justify-content:center;line-height:1;text-align:center}
.area-detail-head .detail-actions .toolbar-btn .material-icon{flex-shrink:0;display:inline-flex}
.toolbar-btn.is-active{background:var(--primary) !important;color:var(--on-primary) !important;border-color:var(--primary) !important;box-shadow:inset 0 -2px 0 rgba(0,0,0,0.15),0 2px 6px color-mix(in srgb,var(--primary) 30%,transparent) !important;font-weight:600}
.toolbar-btn.is-active .material-icon{color:var(--on-primary) !important}
:root[data-system="fluent"] .area-detail-head{box-shadow:none;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-control)}
:root[data-system="fluent"] .area-path-block .path-line{border-radius:var(--radius-control);border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);background:color-mix(in srgb,var(--primary) 10%,var(--bg-card))}
:root[data-system="material"] .area-detail-head{background:var(--bg-card);border:1px solid color-mix(in srgb,var(--border-color) 50%,transparent);border-radius:18px}
:root[data-system="material"] .area-path-block .path-line{border-radius:18px;background:color-mix(in srgb,var(--primary) 14%,var(--bg-card));border:1px solid color-mix(in srgb,var(--primary) 28%,transparent)}
/* ===== Category Tabs ===== */
.category-tabs{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 16px}
.category-tab{cursor:pointer}
.category-tab.active{background:var(--primary);color:var(--on-primary)}

/* Search wrap with icon prefix */
.search-wrap{display:flex;align-items:center;flex:1 1 260px;min-width:220px;position:relative}
.search-wrap .material-icon.search-prefix{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;width:auto;height:auto;color:var(--text-muted);pointer-events:none}
.search-wrap input[type="text"]{/*flex:none;*/min-width:unset;width:100%}
:root[data-system="material"] .search-wrap input{padding-left:36px;border-radius:28px}
:root[data-system="fluent"] .search-wrap input[type="text"]{padding-left:34px;border-radius:var(--radius-control)}

/* ===== Font Size Modes ===== */
:root{--font-base:13px}
:root[data-font="lg"]{--font-base:15px}
:root[data-font="xs"]{--font-base:11px}
/* ===== Media Grid ===== */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(10vw,140px),1fr));gap:10px;margin-top:12px}
.media-card{border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;gap:2px;min-height:48px;cursor:pointer;text-decoration:none;color:inherit;border:1px solid color-mix(in srgb,var(--border-color) 18%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--bg-card) 92%,transparent) 0%, color-mix(in srgb,var(--bg-card) 80%,transparent) 100%);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease;position:relative;overflow:hidden}
.media-card .title{font-size:11px;font-weight:700;line-height:1.25}
.media-card .meta{font-size:calc(var(--font-base) - 3px);color:var(--text-muted)}
.media-card .badge{align-self:flex-start;border-radius:999px;padding:1px 5px;background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary);font-size:8px;font-weight:700}
/* ===== TMDB Flip Card Grid ===== */
.tmdb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 16px;margin:12px 0 0}
/* Flip wrapper — perspective container */
.tmdb-flip-wrapper{align-self:stretch;cursor:pointer;position:relative}
/* Shared face styles */
.tmdb-flip-front,.tmdb-flip-back{border-radius:14px;border:1px solid color-mix(in srgb,var(--border-color) 18%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--bg-card) 92%,transparent) 0%,color-mix(in srgb,var(--bg-card) 80%,transparent) 100%);box-shadow:var(--shadow-sm);padding:16px 18px;display:flex;flex-direction:column;transition:opacity .35s ease,transform .35s ease;width:100%;box-sizing:border-box;overflow:hidden}
/* Front face — fills wrapper height so all cards in a row match */
.tmdb-flip-front{opacity:1;transform:scale(1);min-height:200px;height:100%}
.tmdb-flip-front .title{font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px;margin-bottom:2px}
.tmdb-flip-front .meta{font-size:calc(var(--font-base) - 1px);line-height:1.3;display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:4px}
.tmdb-flip-front .meta .material-icon.star-icon{font-size:14px;color:var(--primary);flex-shrink:0}
.tmdb-flip-front .tmdb-overview{font-size:13px;color:var(--text-muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;border-top:1px solid color-mix(in srgb,var(--primary) 24%,transparent);margin-top:10px;padding-top:8px;padding-bottom:2px}
/* Inline status + link in meta row */
.tmdb-card-status-inline{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:600;margin-left:6px;flex-shrink:0;vertical-align:middle}
.tmdb-card-status-inline .material-icon{font-size:12px}
.tmdb-card-status-inline.in{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
.tmdb-card-status-inline.out{background:color-mix(in srgb,var(--text-muted) 10%,transparent);color:var(--text-muted)}
.tmdb-card-status-inline.que{background:color-mix(in srgb,#e37400 14%,transparent);color:#e37400}
/* TMDB Front: Rating Block */
.tmdb-rating-block{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--primary) 12%,transparent);border:1px solid color-mix(in srgb,var(--primary) 22%,transparent);flex-shrink:0;vertical-align:middle}
.tmdb-rating-label{font-size:10px;font-weight:600;color:var(--primary);line-height:1}
.tmdb-rating-icon{display:inline-block;width:12px;height:12px;color:var(--primary);flex-shrink:0}
.tmdb-rating-value{font-size:11px;font-weight:700;color:var(--primary);line-height:1}
/* TMDB Front: Jump Button */
.tmdb-jump-btn{display:inline-flex;align-items:center;justify-content:center;gap:3px;padding:2px 8px;border-radius:999px;background:#032541;border:1px solid #1a5276;flex-shrink:0;vertical-align:middle;text-decoration:none;transition:background .18s ease,border-color .18s ease}
.tmdb-jump-btn:hover{background:#1a5276;border-color:#2c6a94}
.tmdb-jump-btn .tmdb-jump-icon{color:#fff}
.tmdb-jump-logo{height:12px;width:auto;display:inline-block;vertical-align:middle}
.tmdb-jump-icon{display:inline-block;width:11px;height:11px;color:var(--primary);flex-shrink:0}
/* ===== Season Bars (multi-season indicator) ===== */
.tmdb-season-bars{position:absolute;top:-1px;left:14px;display:flex;gap:3px;z-index:3;pointer-events:none}
.tmdb-season-bar{display:block;width:5px;height:16px;border-radius:0 0 2px 2px;border:1px solid rgba(255,255,255,.18);border-top:none}
.tmdb-season-bar.bar-green{background:#a5d6a7}
.tmdb-season-bar.bar-blue{background:#90caf9}
.tmdb-season-bar.bar-purple{background:#ce93d8}
:root[data-system="fluent"] .tmdb-season-bar{border-radius:0 0 2px 2px}
/* Back face — positioned absolutely, same size as front, NO scrollbar */
.tmdb-flip-back{position:absolute;top:0;left:0;right:0;bottom:0;opacity:0;transform:scale(0.95);pointer-events:none;overflow:hidden;justify-content:flex-start;gap:6px;background-size:cover;background-position:center;background-repeat:no-repeat;transition:opacity .35s ease,transform .35s ease,background-image .3s ease}
/* Backdrop dimming overlay — brightness reduction only, no gaussian blur */
.tmdb-flip-back::before{content:'';position:absolute;inset:0;z-index:0;background:rgba(0,0,0,.3);pointer-events:none}
/* Back face content sits above overlay */
.tmdb-flip-back > *{position:relative;z-index:1}
/* Flip state */
.tmdb-flip-wrapper.flipped .tmdb-flip-front{opacity:0;transform:scale(0.95);pointer-events:none}
.tmdb-flip-wrapper.flipped .tmdb-flip-back{opacity:1;transform:scale(1);pointer-events:auto}
/* ===== Back Card: Poster + Info ===== */
.tt-layout{display:flex;gap:12px}
.tt-poster-wrap{flex-shrink:0;width:90px;position:relative}
.tt-poster{width:90px;aspect-ratio:2/3;object-fit:cover;border-radius:8px;border:2px solid var(--primary);background:var(--bg-page);display:block;backdrop-filter:none!important;filter:none!important}
.tt-poster-placeholder{width:90px;aspect-ratio:2/3;border-radius:8px;border:2px solid color-mix(in srgb,var(--border-color) 30%,transparent);background:color-mix(in srgb,var(--bg-control) 50%,transparent);display:block;backdrop-filter:none!important;filter:none!important}
.tt-poster-loading{width:90px;aspect-ratio:2/3;border-radius:8px;border:2px solid color-mix(in srgb,var(--border-color) 30%,transparent);background:color-mix(in srgb,var(--bg-card) 34%,transparent);display:flex;align-items:center;justify-content:center}
.tt-poster-loading .spinner{width:14px;height:14px;border:2px solid color-mix(in srgb,var(--primary) 24%,transparent);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite}
.tt-poster-error{width:90px;aspect-ratio:2/3;border-radius:8px;border:2px solid color-mix(in srgb,var(--border-color) 30%,transparent);background:color-mix(in srgb,var(--bg-control) 40%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:color-mix(in srgb,var(--text-muted) 42%,transparent);cursor:pointer;transition:background .18s ease}
.tt-poster-error:hover{background:color-mix(in srgb,var(--bg-control) 60%,transparent)}
.tt-poster-error .tt-poster-fallback-svg{width:32px;height:48px;display:block;pointer-events:none}
.tt-poster-error .tt-poster-retry-text{font-size:10px;line-height:1;color:color-mix(in srgb,var(--text-muted) 48%,transparent);pointer-events:none}
.tt-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.tt-title{font-size:14px;font-weight:700;color:#fff;line-height:1.4;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 8px;border-radius:8px;background:color-mix(in srgb,var(--bg-card) 44%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid color-mix(in srgb,var(--border-color) 16%,transparent)}
.tt-original{font-size:calc(var(--font-base) - 2px);color:#fff;line-height:1.4;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--bg-card) 40%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid color-mix(in srgb,var(--border-color) 14%,transparent)}
.tt-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
/* ===== Genre Tags ===== */
.tt-genre-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.tt-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:var(--radius-control,6px);font-size:calc(var(--font-base) - 2px);font-weight:600;background:color-mix(in srgb,var(--bg-card) 44%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid color-mix(in srgb,var(--primary) 22%,transparent);color:#fff;white-space:nowrap}
.tt-tag.tt-loading,.tt-tag.tt-empty{background:color-mix(in srgb,var(--bg-card) 40%,transparent);border-color:color-mix(in srgb,var(--text-muted) 16%,transparent);color:#ccc;font-weight:500}
.tt-tag.tt-genre{color:#fff;max-width:calc(33% - 2px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:1}
/* ===== Back Card: Overview ===== */
.tt-overview-wrap{background:color-mix(in srgb,var(--bg-card) 40%,transparent);border:1px solid color-mix(in srgb,var(--border-color) 20%,transparent);border-radius:10px;padding:8px 10px;margin-left:0;margin-right:0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tt-overview{font-size:calc(var(--font-base) - 1px);color:#fff;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
/* ===== Fluent theme overrides ===== */
:root[data-system="fluent"] .tmdb-flip-front,:root[data-system="fluent"] .tmdb-flip-back{border-radius:var(--radius-card);border:1px solid var(--border-color)}
:root[data-system="fluent"] .tmdb-card-status-inline{border-radius:var(--radius-control)}
:root[data-system="fluent"] .tt-poster{border-radius:4px}
:root[data-system="fluent"] .tt-poster-loading{border-radius:4px}
:root[data-system="fluent"] .tt-poster-error{border-radius:4px}
:root[data-system="fluent"] .tt-title{border-radius:var(--radius-control)}
:root[data-system="fluent"] .tt-overview-wrap{border-radius:var(--radius-control)}
:root[data-system="fluent"] .tmdb-rating-block,
:root[data-system="fluent"] .tmdb-jump-btn{border-radius:var(--radius-control)}
/* ===== Material theme overrides ===== */
:root[data-system="material"] .tmdb-card-status-inline{border-radius:20px}
:root[data-system="material"] .tt-overview-wrap{border-radius:10px}
/* Back icon-only button */
.back-icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--radius-pill);background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--primary);text-decoration:none;transition:background .18s ease;flex-shrink:0}
.back-icon-btn:hover{background:color-mix(in srgb,var(--primary) 20%,transparent)}
/* TMDB user avatar */
.tmdb-user-info{display:flex;align-items:center;gap:10px}
.tmdb-avatar{width:36px;height:36px;border-radius:50%;border:2px solid color-mix(in srgb,var(--primary) 30%,transparent);object-fit:cover;background:var(--bg-control)}
.tmdb-user-name{font-size:var(--font-base);color:var(--text-muted);font-weight:500}
.tmdb-user-name a{color:var(--primary);text-decoration:none}
.tmdb-user-name a:hover{text-decoration:underline}

/* ===== Season Details & Tables ===== */
.season-details{border-radius:var(--radius-card);margin:14px 0;overflow:hidden}
.season-details summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
.season-details summary::-webkit-details-marker{display:none}
.season-details[open]{box-shadow:var(--shadow-md)}
table{width:100%;border-collapse:separate;border-spacing:0;border-radius:var(--radius-card);overflow:hidden;margin:12px 0 20px}
thead th{background:color-mix(in srgb,var(--primary) 10%,var(--bg-card));color:var(--text-main);font-size:calc(var(--font-base,13px) - 1px);letter-spacing:.2px;padding:10px 12px;text-align:left}
tbody td{padding:8px 10px;border-top:1px solid color-mix(in srgb,var(--border-color) 14%,transparent);vertical-align:top;font-size:calc(var(--font-base,13px) - 1px);white-space:nowrap}
tbody tr:hover{background:color-mix(in srgb,var(--primary) 7%,var(--bg-card))}
td.mono{font-family:'Cascadia Code','Fira Code',monospace;font-size:calc(var(--font-base) - 1px);word-break:break-all}

/* ===== Pager ===== */
.pager{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:20px;font-size:var(--font-base)}
.pager a{color:var(--primary);text-decoration:none;display:inline-flex;align-items:center;gap:4px;font-weight:500}
.pager a:hover{text-decoration:underline}
.pager .current{color:var(--text-muted);font-weight:600}
/* Type-tab pill buttons — base = MD3 style */
.type-tab{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:var(--font-base);font-weight:600;text-decoration:none;cursor:pointer;transition:all .18s;border:1px solid transparent;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 18%,transparent)}
.type-tab:hover{background:color-mix(in srgb,var(--primary) 22%,transparent)}
.type-tab.active{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
:root[data-system="material"] .type-tab{border-radius:20px;padding:6px 16px}
:root[data-system="material"] .type-tab.active{box-shadow:0 1px 2px rgba(0,0,0,.15)}
:root[data-system="fluent"] .type-tab{border-radius:var(--radius-control,4px);padding:5px 12px;font-weight:500}
:root[data-system="fluent"] .type-tab.active{border:1px solid var(--primary);box-shadow:none}
/* Page info badge (non-selectable) — base = MD3 */
.tmdb-page-info{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;font-size:calc(var(--font-base) - 1px);font-weight:600;background:color-mix(in srgb,var(--text-muted) 10%,transparent);color:var(--text-muted);border:1px solid color-mix(in srgb,var(--text-muted) 15%,transparent);user-select:none;-webkit-user-select:none}
:root[data-system="material"] .tmdb-page-info{border-radius:20px}
:root[data-system="fluent"] .tmdb-page-info{border-radius:var(--radius-control,4px);font-weight:500;border-color:var(--border-color)}
/* Pager themed buttons — base = MD3 style */
.pager-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:999px;font-size:var(--font-base);font-weight:600;text-decoration:none;cursor:pointer;transition:all .18s;border:1px solid transparent;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 20%,transparent)}
.pager-btn:hover{background:color-mix(in srgb,var(--primary) 22%,transparent);border-color:color-mix(in srgb,var(--primary) 32%,transparent)}
.pager-btn:active{transform:scale(.97)}
:root[data-system="material"] .pager-btn{border-radius:20px;padding:8px 20px}
:root[data-system="material"] .pager-btn.active{box-shadow:0 1px 2px rgba(0,0,0,.15)}
:root[data-system="fluent"] .pager-btn{border-radius:var(--radius-control,4px);padding:6px 14px;font-weight:500}
:root[data-system="fluent"] .pager-btn:hover{background:color-mix(in srgb,var(--primary) 16%,transparent)}

/* ===== TMDB Export Buttons (in header bar) ===== */
.tmdb-export-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:var(--radius-control,6px);border:1px solid color-mix(in srgb,var(--border-color) 26%,transparent);background:color-mix(in srgb,var(--bg-card) 80%,transparent);color:var(--text-muted);cursor:pointer;font-size:15px;padding:0;transition:all .18s;flex-shrink:0;text-decoration:none;font-family:inherit}
.tmdb-export-btn:hover{background:color-mix(in srgb,var(--primary) 14%,var(--bg-card));color:var(--primary);border-color:color-mix(in srgb,var(--primary) 30%,transparent)}
.tmdb-export-btn .material-icon{font-size:15px}
:root[data-system="fluent"] .tmdb-export-btn{border-radius:var(--radius-control)}
:root[data-system="material"] .tmdb-export-btn{border-radius:8px}

/* ===== TMDB Status ===== */
.status-legend{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 16px;padding:14px 16px;border-radius:18px;background:color-mix(in srgb,var(--bg-card) 88%,transparent);border:1px solid color-mix(in srgb,var(--border-color) 18%,transparent)}
.legend-badge{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;font-size:calc(var(--font-base) - 1px);font-weight:600;cursor:pointer;text-decoration:none;transition:all .18s;border:1px solid transparent}
.legend-badge.in{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 20%,transparent)}
.legend-badge.out{background:color-mix(in srgb,var(--text-muted) 14%,transparent);color:var(--text-muted);border-color:color-mix(in srgb,var(--text-muted) 20%,transparent)}
.legend-badge.que{background:color-mix(in srgb,var(--warn-color,#e37400) 14%,transparent);color:var(--warn-color,#e37400);border-color:color-mix(in srgb,var(--warn-color,#e37400) 20%,transparent)}
.legend-badge.active{color:var(--on-primary)}
.legend-badge.in.active{background:var(--primary)}
.legend-badge.out.active{background:var(--text-muted)}
.legend-badge.que.active{background:var(--warn-color,#e37400)}
.tmdb-status-badge{position:absolute;top:6px;right:6px;z-index:1;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1px solid transparent;pointer-events:none;backdrop-filter:blur(4px);padding:0}
.tmdb-status-badge.in{background:color-mix(in srgb,var(--primary) 20%,transparent);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 28%,transparent)}
.tmdb-status-badge.out{background:color-mix(in srgb,#5f6368 16%,transparent);color:#5f6368;border-color:color-mix(in srgb,#5f6368 20%,transparent)}
.tmdb-status-badge.que{background:color-mix(in srgb,#e37400 18%,transparent);color:#e37400;border-color:color-mix(in srgb,#e37400 22%,transparent)}
.tmdb-status-badge .material-icon{font-size:12px}

/* ===== Log ===== */
.log-panel{background:color-mix(in srgb,var(--bg-card) 88%,transparent);border:1px solid color-mix(in srgb,var(--border-color) 18%,transparent);border-radius:18px;padding:14px;max-height:600px;overflow-y:auto;font-family:'Cascadia Code','Fira Code',monospace;font-size:calc(var(--font-base) - 1px);line-height:1.6}
.log-line{padding:2px 0;white-space:pre-wrap;word-break:break-all}
.log-line.error{color:#d93025}.log-line.warn{color:#e37400}.log-line.info{color:var(--primary)}.log-line.debug{color:var(--text-muted)}

/* ===== Config ===== */
.config-section{background:color-mix(in srgb,var(--bg-card) 88%,transparent);border:1px solid color-mix(in srgb,var(--border-color) 18%,transparent);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.config-section h3{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-size:16px;color:var(--text-main)}
.config-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--border-color) 10%,transparent)}
.config-row:last-child{border-bottom:none}
.config-row .key{font-size:var(--font-base);color:var(--text-muted);font-weight:500}
.config-row .val{font-size:var(--font-base);color:var(--text-main);font-weight:600;word-break:break-all;max-width:60%;text-align:right}
.floating-field{padding:4px 0 6px;border-bottom:1px solid color-mix(in srgb,var(--border-color) 10%,transparent)}
.floating-field:last-child{border-bottom:none}
.floating-field .field-control{position:relative;min-height:52px;padding-top:14px}
.floating-label{position:absolute;left:12px;top:14px;transform:translateY(0);font-size:var(--font-base);color:var(--text-muted);pointer-events:none;transition:all .18s ease;opacity:0;padding:0;z-index:1;line-height:1;background:transparent;transform-origin:left top;white-space:nowrap}
.floating-label.is-shown{opacity:1}
.floating-label.is-floating{top:0;transform:translateY(0) scale(.82);color:var(--primary)}
.floating-label.is-filled{top:0;transform:translateY(0) scale(.82);color:var(--text-muted)}
.floating-field input,.floating-field select{width:100%;border:none;outline:none;background:color-mix(in srgb,var(--bg-control) 60%,transparent);color:var(--text-main);font:inherit;padding:11px 12px;border-radius:var(--radius-card);border:1px solid color-mix(in srgb,var(--border-color) 22%,transparent);box-shadow:none;transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;box-sizing:border-box;line-height:1.4}
.floating-field input::placeholder{color:var(--text-muted);opacity:.75;transition:opacity .18s ease}
.floating-field input:focus::placeholder,.floating-field input.has-value::placeholder{opacity:0}
.floating-field input:focus,.floating-field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 16%,transparent);background:color-mix(in srgb,var(--bg-control) 88%,transparent)}
.floating-field .field-select-wrap{display:flex;align-items:stretch;gap:6px}
.floating-field .field-select-wrap select{flex:1;min-width:0;padding:11px 12px;border-radius:var(--radius-card)}
.floating-field .field-select-wrap.has-custom select{display:none}
.floating-field .field-select-wrap.has-custom input[type="text"]{flex:1;min-width:0;border-radius:var(--radius-card)}
.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 16px}
.field-grid .floating-field{border-bottom:none;padding:4px 0}
.field-grid .floating-field .field-control{max-width:320px}
.floating-field.is-hidden{display:none}
.config-form-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.config-form-actions .toolbar-btn{min-width:128px}

.config-blocks-wrapper{max-width:620px;margin:0 auto}
.config-blocks-row{display:flex;gap:14px;margin-bottom:14px}
.config-blocks-row .config-section{flex:1;margin-bottom:0}
.tmdb-section .field-grid{justify-items:stretch}
.floating-field input.readonly-field{background:color-mix(in srgb,var(--bg-control) 30%,transparent);color:var(--text-muted);cursor:default;border-color:color-mix(in srgb,var(--border-color) 12%,transparent)}
.floating-field input.readonly-field:focus{box-shadow:none;border-color:color-mix(in srgb,var(--border-color) 12%,transparent);background:color-mix(in srgb,var(--bg-control) 30%,transparent)}

/* ===== Notes ===== */
.config-notes{font-size:calc(var(--font-base) - 1px);color:var(--text-muted);line-height:1.7}
.config-notes details{margin-bottom:6px;border-radius:var(--radius-card);border:1px solid color-mix(in srgb,var(--border-color) 14%,transparent);padding:8px 12px}
.config-notes details[open]{background:color-mix(in srgb,var(--bg-control) 20%,transparent)}
.config-notes summary{cursor:pointer;font-weight:500;color:var(--text-main);padding:2px 0}

/* ===== Config Page: Left Nav Layout ===== */
.config-layout{display:flex;gap:20px;align-items:flex-start}
.config-sidebar{flex-shrink:0;width:180px;display:flex;flex-direction:column;gap:2px;background:color-mix(in srgb,var(--bg-card) 88%,transparent);border:1px solid color-mix(in srgb,var(--border-color) 18%,transparent);border-radius:18px;padding:8px;box-shadow:var(--shadow-sm);backdrop-filter:blur(12px)}
.config-sidebar a{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--radius-control);color:var(--text-muted);text-decoration:none;font-size:var(--font-base);font-weight:500;transition:all .15s;cursor:pointer}
.config-sidebar a:hover{background:color-mix(in srgb,var(--primary) 10%,var(--bg-card));color:var(--primary)}
.config-sidebar a.active{background:color-mix(in srgb,var(--primary) 14%,var(--bg-card));color:var(--primary);font-weight:600}
.config-content{flex:1;min-width:0}
.config-row-readonly .key{color:var(--text-muted);font-weight:500}
.config-row-readonly .val{color:var(--text-main);font-weight:600;word-break:break-all;max-width:60%;text-align:right}

/* ===== Toast ===== */
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;font-size:var(--font-base);font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.08);transform:translateX(120%);opacity:0;transition:all .35s cubic-bezier(.4,0,.2,1);max-width:360px;backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--border-color) 18%,transparent)}
:root[data-system="fluent"] .toast{border-radius:4px}
:root[data-system="material"] .toast{border-radius:14px}
.toast.show{transform:translateX(0);opacity:1}
.toast.toast-success{background:color-mix(in srgb,var(--primary) 16%,var(--bg-card));color:var(--primary);border-color:color-mix(in srgb,var(--primary) 24%,transparent)}
.toast.toast-error{background:color-mix(in srgb,#d93025 16%,var(--bg-card));color:#d93025;border-color:color-mix(in srgb,#d93025 24%,transparent)}
.toast.toast-info{background:color-mix(in srgb,var(--primary) 12%,var(--bg-card));color:var(--primary);border-color:color-mix(in srgb,var(--primary) 18%,transparent)}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}
.modal-box{background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;padding:28px 32px;max-width:420px;width:90%;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.modal-title{font-size:16px;font-weight:600;margin-bottom:14px;color:var(--text-main);display:flex;align-items:center;gap:8px}
.modal-body p{font-size:14px;color:var(--text-muted);margin:6px 0}
.modal-checkbox{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--text-muted);cursor:pointer}
.modal-checkbox input{accent-color:var(--primary)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.modal-btn{padding:8px 20px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid color-mix(in srgb,var(--border-color) 40%,transparent);font-family:inherit;transition:background .18s}
.modal-btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.modal-btn.primary:hover{background:var(--primary-hover)}
.modal-btn.secondary{background:transparent;color:var(--text-main)}
.modal-btn.secondary:hover{background:color-mix(in srgb,var(--bg-control) 50%,var(--bg-card))}
:root[data-system="fluent"] .modal-box{border-radius:8px}
:root[data-system="material"] .modal-box{border-radius:20px}

/* ===== Loading ===== */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text-muted);font-size:var(--font-base);gap:10px}
.spinner{width:20px;height:20px;border:2px solid color-mix(in srgb,var(--primary) 20%,transparent);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{background:color-mix(in srgb,#d93025 10%,var(--bg-card));border:1px solid color-mix(in srgb,#d93025 24%,transparent);border-radius:10px;padding:20px;color:#d93025;font-size:var(--font-base);display:flex;align-items:center;gap:10px}

/* ===== Responsive ===== */
@media(max-width:900px){header{padding:12px 14px}.container{padding:14px}.theme-controls{min-width:unset}.media-grid{grid-template-columns:repeat(auto-fill,minmax(max(10vw,100px),1fr))}.tmdb-grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px 12px}.stat-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
</style>
</head>
<body>
<div id="wallpaper-a"></div>
<div id="wallpaper-b"></div>

<div id="toast-container"></div>
<header>
  <div>
    <span class="brand" id="brand-title">
      <img src="logo.png" alt="STRM Bridge" style="height:5vh;border-radius:12px;object-fit:contain;vertical-align:middle">
      <span>STRM Bridge</span>
    </span>
    
  </div>
  <nav class="nav" id="main-nav"></nav>
  <div class="theme-controls">
    <div class="dropdown-wrap" id="theme-system-dd">
      <button class="dropdown-btn" id="theme-system-btn" title="切换设计风格">
        <span id="theme-preset-icon"></span>
        <span class="dropdown-arrow">▾</span>
      </button>
      <div class="dropdown-menu" id="theme-system-menu">
        <div class="dropdown-item" data-val="material"><span class="material-icon filled" style="font-size:18px;color:var(--primary)">palette</span> Material 3</div>
        <div class="dropdown-item" data-val="fluent"><span class="material-icon" style="font-size:18px;color:var(--primary)">grid_view</span> Fluent 2</div>
      </div>
    </div>
    <div class="dropdown-wrap" id="theme-fontsize-dd">
      <button class="dropdown-btn" id="theme-fontsize-btn" title="切换字号">
        <span id="fontsize-icon" style="font-size:12px;font-weight:600;color:var(--text-main)">Aa</span>
        <span class="dropdown-arrow">▾</span>
      </button>
      <div class="dropdown-menu" id="theme-fontsize-menu">
        <div class="dropdown-item" data-val="lg"><span style="font-size:15px;font-weight:600">Aa</span> 大 (15px)</div>
        <div class="dropdown-item" data-val="sm"><span style="font-size:13px;font-weight:600">Aa</span> 正常 (13px)</div>
        <div class="dropdown-item" data-val="xs"><span style="font-size:11px;font-weight:600">Aa</span> 小 (11px)</div>
      </div>
    </div>
    <div class="dropdown-wrap" id="theme-color-dd">
      <button class="dropdown-btn" id="theme-color-btn" title="切换主题颜色">
        <span class="color-dot-icon" id="color-dot-icon"></span>
        <span class="dropdown-arrow">▾</span>
      </button>
      <div class="dropdown-menu" id="theme-color-menu">
        <div class="dropdown-item" data-val="blue"><span class="color-dot cd-blue"></span> 蓝色</div>
        <div class="dropdown-item" data-val="purple"><span class="color-dot cd-purple"></span> 紫色</div>
        <div class="dropdown-item" data-val="green"><span class="color-dot cd-green"></span> 绿色</div>
        <div class="dropdown-item" data-val="orange"><span class="color-dot cd-orange"></span> 橙色</div>
      </div>
    </div>
  </div>
</header>
<main class="container" id="app-main">
  <div class="loading"><div class="spinner"></div> 加载中...</div>
</main>

<script>
// ============================================================
// Material Symbols icon map
// ============================================================
const ICON_MAP = {
  dashboard:'dashboard', area_a:'view_week', area_b:'table_rows', area_c:'psychology',
  tmdb:'local_movies', movie:'movie', tv:'tv', log:'article', config:'settings',
  search:'search', theme:'palette', color:'format_paint', download:'download',
  csv:'table_chart', json:'data_object', plus:'add_circle', web:'language',
  check:'check_circle', warn:'warning', error:'error', info:'info',
  back:'arrow_back', chevron_l:'chevron_left', chevron_r:'chevron_right',
  expand:'expand_more', collapse:'expand_less', database:'storage',
  globe:'language', arrow_up:'arrow_upward', arrow_down:'arrow_downward',
  folder:'folder', refresh:'refresh',
  badge_in:'check_circle',   badge_out:'radio_button_unchecked', badge_que:'help', star:'star',
};
const FILLED_ICONS = new Set(['badge_in','badge_out','badge_que','star','check','plus']);

function icon(name, cls='') {
  const symbol = ICON_MAP[name] || 'help';
  const classes = ['material-icon'];
  if (FILLED_ICONS.has(name)) classes.push('filled');
  if (cls) classes.push(cls);
  return `<span class="${classes.join(' ')}" aria-hidden="true">${symbol}</span>`;
}

// ============================================================
// Theme
// ============================================================
function syncTheme() {
  const root = document.documentElement;
  const system = root.dataset.system || 'material';
  const color = root.dataset.color || 'blue';
  const font = root.dataset.font || 'sm';
  // Update dropdown active states
  document.querySelectorAll('#theme-system-menu .dropdown-item').forEach(el => {
    el.classList.toggle('active', el.dataset.val === system);
  });
  document.querySelectorAll('#theme-color-menu .dropdown-item').forEach(el => {
    el.classList.toggle('active', el.dataset.val === color);
  });
  document.querySelectorAll('#theme-fontsize-menu .dropdown-item').forEach(el => {
    el.classList.toggle('active', el.dataset.val === font);
  });
  // Update preset icon
  const presetIcon = document.getElementById('theme-preset-icon');
  if (presetIcon) {
     presetIcon.innerHTML = system === 'fluent'
       ? '<span class="material-icon" style="font-size:18px;color:var(--primary)">grid_view</span>'
       : '<span class="material-icon filled" style="font-size:18px;color:var(--primary)">palette</span>';
  }
  // Update color dot
  const colorDot = document.getElementById('color-dot-icon');
  if (colorDot) {
    const colorMap = {blue:'#1a73e8',purple:'#7b1fa2',green:'#2e7d32',orange:'#e65100'};
    colorDot.style.background = colorMap[color] || 'var(--primary)';
  }
  // Update font size icon
  const fsIcon = document.getElementById('fontsize-icon');
  if (fsIcon) {
    const fsMap = {lg:'15px',sm:'13px',xs:'11px'};
    fsIcon.style.fontSize = fsMap[font] || '13px';
  }
  try {
    localStorage.setItem('webui_theme_system', system);
    localStorage.setItem('webui_theme_color', color);
    localStorage.setItem('webui_theme_fontsize', font);
  } catch(e) {}
}

// Dropdown toggle logic
function initDropdowns() {
  document.querySelectorAll('.dropdown-wrap').forEach(wrap => {
    const btn = wrap.querySelector('.dropdown-btn');
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      // Close other dropdowns
      document.querySelectorAll('.dropdown-wrap.open').forEach(w => { if (w !== wrap) w.classList.remove('open'); });
      wrap.classList.toggle('open');
    });
    wrap.querySelectorAll('.dropdown-item').forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        const val = item.dataset.val;
        const root = document.documentElement;
        if (wrap.id === 'theme-system-dd') {
          root.dataset.system = val;
        } else if (wrap.id === 'theme-color-dd') {
          root.dataset.color = val;
        } else if (wrap.id === 'theme-fontsize-dd') {
          root.dataset.font = val;
        }
        wrap.classList.remove('open');
        syncTheme();
        router();
      });
    });
  });
  // Close dropdowns on outside click
  document.addEventListener('click', () => {
    document.querySelectorAll('.dropdown-wrap.open').forEach(w => w.classList.remove('open'));
  });
}

// ============================================================
// Toast
// ============================================================
function showToast(msg, type='info') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  const iconMap = {success:'check',error:'error',info:'info'};
  const toastIconName = iconMap[type] || 'info';
  el.innerHTML = `${icon(toastIconName)}<span>${esc(msg)}</span>`;
  container.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 400);
  }, 3000);
}

// ============================================================
// Cache Stale Modal
// ============================================================
function _formatTimeAgo(ts) {
  const sec = Math.floor(Date.now() / 1000 - ts);
  if (sec < 60) return `${sec} 秒前`;
  if (sec < 3600) return `${Math.floor(sec / 60)} 分钟前`;
  if (sec < 86400) return `${Math.floor(sec / 3600)} 小时前`;
  return `${Math.floor(sec / 86400)} 天前`;
}

function showCacheStaleModal(itemCount, lastSync) {
  const existing = document.getElementById('cache-stale-modal');
  if (existing) existing.remove();
  const ago = lastSync ? _formatTimeAgo(lastSync) : '未知';
  const overlay = document.createElement('div');
  overlay.id = 'cache-stale-modal';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">${icon('warn')} TMDB 缓存已过期</div>
      <div class="modal-body">
        <p>当前缓存 ${itemCount} 项，上次同步：${ago}</p>
        <p>是否后台刷新？（约 30 秒，期间可正常使用页面）</p>
        <label class="modal-checkbox">
          <input type="checkbox" id="cache-never-remind"> 不再提醒
        </label>
      </div>
      <div class="modal-actions">
        <button class="modal-btn secondary" id="cache-modal-cancel">取消</button>
        <button class="modal-btn primary" id="cache-modal-ok">好的</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('cache-modal-cancel').onclick = () => {
    const cb = document.getElementById('cache-never-remind');
    if (cb.checked) localStorage.setItem('tmdb_cache_never_remind', '1');
    overlay.remove();
  };
  document.getElementById('cache-modal-ok').onclick = async () => {
    const cb = document.getElementById('cache-never-remind');
    if (cb.checked) localStorage.setItem('tmdb_cache_never_remind', '1');
    overlay.remove();
    showToast('后台同步已启动...', 'info');
    try {
      const resp = await fetch('/api/tmdb/watchlist/sync', { method: 'POST' });
      const data = await resp.json();
      if (data.success) showToast('同步完成后刷新页面即可看到最新数据', 'success');
      else showToast(data.message || '启动同步失败', 'error');
    } catch(e) {
      showToast('启动同步失败: ' + e.message, 'error');
    }
  };
}

// Copy path block content to clipboard
function copyPathBlock(el) {
  const texts = [];
  el.querySelectorAll('.path-line').forEach(line => {
    const label = line.querySelector('.path-label');
    const value = line.querySelector('.path-value');
    if (label && value) texts.push(label.textContent + ' ' + value.textContent);
  });
  const copyText = texts.join('\n');
  navigator.clipboard.writeText(copyText).then(() => {
    showToast('已复制路径到剪贴板', 'success');
  }).catch(() => {
    // Fallback: select text
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges();
    showToast('已复制路径到剪贴板', 'success');
  });
}

// ============================================================
// Format helpers
// ============================================================
function fmtTime(ts) {
  if (!ts) return '-';
  const d = new Date(ts * 1000);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${mm}-${dd} ${hh}:${mi}`;
}

function esc(s) {
  const el = document.createElement('span');
  el.textContent = s || '';
  return el.innerHTML;
}

// ============================================================
// Router
// ============================================================
let _serverStartTime = null; // 从 /api/dashboard 响应的 uptime 初始化

function buildNav(activeTab) {
  const links = [
    ['dashboard','仪表盘','dashboard'],
    ['area_b','B 区','area_b'],
    ['area_a','A 区','area_a'],
    ['area_c','C 区','area_c'],
    ['tmdb','TMDB','tmdb'],
    ['logs','TMDB 日志','log'],
    ['config','配置','config'],
  ];
  // Area links default to kind=anime filter
  const areaLinkMap = { area_b: '?kind=anime', area_a: '?kind=anime', area_c: '?kind=anime' };
  return links.map(([id,label,ic]) => {
    const cls = id === activeTab ? ' class="active"' : '';
    const href = areaLinkMap[id] ? `#${id}${areaLinkMap[id]}` : `#${id}`;
    return `<a href="${href}" data-tab="${id}"${cls}>${icon(ic)} ${label}</a>`;
  }).join('\n');
}

function parseHash() {
  const hash = location.hash.slice(1) || 'dashboard';
  const [page, qstr] = hash.split('?');
  const params = {};
  if (qstr) {
    for (const kv of qstr.split('&')) {
      const [k, v] = kv.split('=');
      params[decodeURIComponent(k)] = decodeURIComponent(v || '');
    }
  }
  return { page, params };
}

function navigate(hash) {
  location.hash = hash;
}

async function router() {
  const { page, params } = parseHash();
  const mainEl = document.getElementById('app-main');
  const navEl = document.getElementById('main-nav');

  // Update nav
  navEl.innerHTML = buildNav(page);

  // Update uptime
  updateUptime();

  // Show loading
  mainEl.innerHTML = '<div class="loading"><div class="spinner"></div> 加载中...</div>';

  try {
    if (page === 'dashboard') await renderDashboard(mainEl);
    else if (page.startsWith('area_')) await renderArea(mainEl, page.replace('area_',''), params);
    else if (page === 'tmdb') await renderTmdb(mainEl, params);
    else if (page === 'logs') await renderLogs(mainEl);
    else if (page === 'config') await renderConfig(mainEl, params);
    else mainEl.innerHTML = '<div class="error-msg">页面不存在</div>';
  } catch(e) {
    console.error('Router error:', e);
    mainEl.innerHTML = `<div class="error-msg">${icon('error')} ${esc(e.message)}</div>`;
  }
}

// ============================================================
// API helpers
// ============================================================
async function api(path) {
  const resp = await fetch(path);
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error || `HTTP ${resp.status}`);
  }
  return resp.json();
}

// ============================================================
// Render: Dashboard
// ============================================================
async function renderDashboard(el) {
  const d = await api('/api/dashboard');
  // 使用服务端运行时长初始化计时器（服务端 WebUIServer._start_time）
  if (d.uptime != null) {
    _serverStartTime = Date.now() - d.uptime * 1000;
  }
  el.innerHTML = `
<h2 style="font-size:20px;margin-bottom:20px;color:var(--text-main)">${icon('dashboard','ui-icon-lg')} 仪表盘</h2>
<div class="stat-grid">
  <div class="stat-card"><div class="label">${icon('movie')} A 区 STRM</div><div class="value">${d.a_count}</div></div>
  <div class="stat-card"><div class="label">${icon('tv')} B 区 STRM</div><div class="value">${d.b_count}</div></div>
  <div class="stat-card"><div class="label">${icon('area_c')} C 区幽灵</div><div class="value">${d.c_count}</div></div>
  <div class="stat-card"><div class="label">B - valid</div><div class="value" style="color:var(--primary)">${d.b_valid}</div></div>
  <div class="stat-card"><div class="label">B - orphan</div><div class="value" style="color:#E37400">${d.b_orphan}</div></div>
  <div class="stat-card"><div class="label">B - unknown</div><div class="value" style="color:#C5221F">${d.b_unknown}</div></div>
  <div class="stat-card"><div class="label">${icon('tmdb')} TMDB</div><div class="value" style="font-size:18px">${d.tmdb_configured ? '已配置' : '未配置'}</div></div>
  <div class="stat-card"><div class="label">运行时间</div><div class="value" style="font-size:18px" id="uptime-val">-</div></div>
</div>`;
}

// ============================================================
// Render: Area (list + detail)
// ============================================================
async function renderArea(el, area, params) {
  const media = params.media || '';
  if (media) {
    await renderAreaDetail(el, area, params);
  } else {
    await renderAreaList(el, area, params);
  }
}

async function renderAreaList(el, area, params) {
  const kind = params.kind || '';
  const q = params.q || '';
  const sort = params.sort || 'name';
  const order = params.order || 'asc';
  const page = parseInt(params.page) || 1;
  let url = `/api/area/${area}`;
  const qs = [];
  if (kind) qs.push('kind=' + encodeURIComponent(kind));
  if (q) qs.push('q=' + encodeURIComponent(q));
  if (sort) qs.push('sort=' + encodeURIComponent(sort));
  if (order) qs.push('order=' + encodeURIComponent(order));
  qs.push('page=' + page);
  if (qs.length) url += '?' + qs.join('&');

  const d = await api(url);
  const kindLabel = d.kind_label;

  // Category tabs
  const kinds = [{v:'anime',l:'番剧',i:'tv'},{v:'movie',l:'电影',i:'movie'}];
  const tabsHtml = kinds.map(k => {
    const active = (kind||'') === k.v ? ' active' : '';
    const href = `#area_${area}?kind=${k.v}&sort=${sort}&order=${order}`;
    const count = d.kind_counts[k.v]||0;
    return `<button class="category-tab${active}" data-kind-href="${href}">${icon(k.i)} ${k.l} <span class="count">${count}</span></button>`;
  }).join('');

  // Sort link helper
  function sortLink(colName, colKey) {
    const newOrder = (sort === colKey && order === 'asc') ? 'desc' : 'asc';
    const arrow = sort === colKey ? (order === 'asc' ? icon('arrow_up') : icon('arrow_down')) : '';
    const href = `#area_${area}?sort=${colKey}&order=${newOrder}${kind?'&kind='+encodeURIComponent(kind):''}${q?'&q='+encodeURIComponent(q):''}`;
    return `<a href="${href}" style="color:var(--primary);text-decoration:none;display:inline-flex;align-items:center;gap:2px;font-weight:600;font-size:calc(var(--font-base) - 1px)" class="sort-btn">${colName}${arrow}</a>`;
  }

  // Media cards
  const cardsHtml = d.media_items.map(item => {
    const href = `#area_${area}?media=${encodeURIComponent(item.name)}${kind?'&kind='+encodeURIComponent(kind):''}${q?'&q='+encodeURIComponent(q):''}`;
    const cardIcon = kind === 'movie' ? 'movie' : 'tv';
    return `<a class="media-card" href="${href}">${icon(cardIcon)}<div class="title">${esc(item.name)}</div><div class="meta">${item.count} 个文件</div></a>`;
  }).join('');

  // Pager
  let pagerHtml = '';
  if (d.total_pages > 1) {
    pagerHtml = '<div class="pager">';
    if (d.page > 1) {
      pagerHtml += `<a href="#area_${area}?page=${d.page-1}&sort=${sort}&order=${order}${kind?'&kind='+encodeURIComponent(kind):''}${q?'&q='+encodeURIComponent(q):''}">${icon('chevron_l')} 上一页</a>`;
    }
    pagerHtml += `<span class="current">第 ${d.page} / ${d.total_pages} 页 (共 ${d.total} 项)</span>`;
    if (d.page < d.total_pages) {
      pagerHtml += `<a href="#area_${area}?page=${d.page+1}&sort=${sort}&order=${order}${kind?'&kind='+encodeURIComponent(kind):''}${q?'&q='+encodeURIComponent(q):''}">下一页 ${icon('chevron_r')}</a>`;
    }
    pagerHtml += '</div>';
  }

  el.innerHTML = `
<h2 style="font-size:20px;margin-bottom:20px;color:var(--text-main)">${icon(kind === 'movie' ? 'movie' : 'tv','ui-icon-lg')} ${esc(kindLabel)} 媒体浏览</h2>
<div class="category-tabs">${tabsHtml}</div>
<div class="toolbar">
  <div class="search-wrap">${icon('search','search-prefix')}<input type="text" id="media-search" placeholder="搜索媒体名..." value="${esc(q)}"></div>
  <button class="search-btn" id="area-search-btn">${icon('search')} 搜索</button>
  <span style="font-size:calc(var(--font-base) - 1px);color:var(--text-muted);margin-left:8px">排序:</span>
  ${sortLink('名称','name')}
  ${sortLink('文件数','count')}
  ${sortLink('时间','time')}
</div>
<div class="media-grid">${cardsHtml}</div>
${pagerHtml}`;

  // Bind search
  document.getElementById('area-search-btn').addEventListener('click', () => {
    const val = document.getElementById('media-search').value.trim();
    let h = `#area_${area}?sort=${sort}&order=${order}`;
    const p = [];
    if (kind) p.push('kind=' + encodeURIComponent(kind));
    if (val) p.push('q=' + encodeURIComponent(val));
    if (p.length) h += '&' + p.join('&');
    navigate(h);
  });
  document.getElementById('media-search').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('area-search-btn').click();
  });
  // Bind category tabs (use navigate to avoid full page reload)
  document.querySelectorAll('.category-tab[data-kind-href]').forEach(tab => {
    tab.addEventListener('click', (e) => {
      e.preventDefault();
      navigate(tab.dataset.kindHref);
    });
  });
}

async function renderAreaDetail(el, area, params) {
  const media = params.media;
  const kind = params.kind || '';
  const sort = params.sort || 'name';
  const order = params.order || 'asc';
  const page = parseInt(params.page) || 1;
  const q = params.q || '';

  let url = `/api/area/${area}/detail?media=${encodeURIComponent(media)}`;
  if (sort) url += '&sort=' + encodeURIComponent(sort);
  if (order) url += '&order=' + encodeURIComponent(order);
  url += '&page=' + page;

  const d = await api(url);

  // Strip path prefix helper: strip local_root / webdav_root from path
  function stripPath(p, root) {
    if (root && p.startsWith(root)) return p.slice(root.length);
    return p;
  }
  const localRoot = d.local_root || '';
  const webdavRoot = d.webdav_root || '';

  // Back bar
  const kindPart = kind ? '?kind=' + encodeURIComponent(kind) : '';
  const areaLabels = {a:'A 区',b:'B 区',c:'C 区'};
  const areaLabel = areaLabels[area] || area.toUpperCase() + ' 区';
  let html = `
<div class="toolbar" style="gap:12px">
  <a href="#area_${area}${kindPart}" class="back-icon-btn" title="返回列表">${icon('back')}</a>
  <span style="color:var(--text-main);font-size:14px;font-weight:600">${esc(media)}</span>
  <span style="color:var(--text-muted);font-size:calc(var(--font-base) - 1px)">· ${d.total} 个文件</span>
</div>`;

  // Show media folder paths (left) + expand/collapse buttons (right) in one row
  const expandBtns = `<div class="detail-actions">
  <button class="toolbar-btn" id="expand-all-btn" style="display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--primary) 10%,transparent);border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);border-radius:var(--radius-control);padding:6px 14px;color:var(--primary);font-size:calc(var(--font-base) - 1px);font-weight:500;cursor:pointer;font-family:inherit">${icon('expand')} 展开全部</button>
  <button class="toolbar-btn" id="collapse-all-btn" style="display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--primary) 10%,transparent);border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);border-radius:var(--radius-control);padding:6px 14px;color:var(--primary);font-size:calc(var(--font-base) - 1px);font-weight:500;cursor:pointer;font-family:inherit">${icon('collapse')} 折叠全部</button>
</div>`;

  if (localRoot || webdavRoot) {
    html += `<div class="area-detail-head"><div class="area-path-block">`;
    if (localRoot) html += `<div class="path-line"><span class="path-label">${areaLabel} 本地根：</span><span class="path-value mono">${esc(localRoot)}</span></div>`;
    if (webdavRoot) html += `<div class="path-line"><span class="path-label">WebDAV 根：</span><span class="path-value mono">${esc(webdavRoot)}</span></div>`;
    html += `</div>${expandBtns}</div>`;
  } else {
    html += `<div class="area-detail-head" style="justify-content:flex-end">${expandBtns}</div>`;
  }

  // Sort link helper
  function sortLink(colName, colKey) {
    const newOrder = (sort === colKey && order === 'asc') ? 'desc' : 'asc';
    const arrow = sort === colKey ? (order === 'asc' ? icon('arrow_up') : icon('arrow_down')) : '';
    let href = `#area_${area}?media=${encodeURIComponent(media)}&sort=${colKey}&order=${newOrder}`;
    if (kind) href += '&kind=' + encodeURIComponent(kind);
    if (q) href += '&q=' + encodeURIComponent(q);
    return `<a href="${href}" style="color:var(--primary);text-decoration:none;display:inline-flex;align-items:center;gap:2px" class="sort-btn">${colName}${arrow}</a>`;
  }

  // Season details
  for (const season of d.seasons) {
    html += `<details class="season-details" open><summary>${esc(season.label)} <span style="font-size:calc(var(--font-base) - 1px);color:var(--text-muted)">(${season.records.length} 个文件)</span></summary>`;
    html += '<div class="table-wrap"><table><thead><tr><th>序号</th>';

    if (area === 'a') {
      html += `<th>${sortLink('本地路径','path')}</th><th>WebDAV 路径</th><th>${sortLink('时间','time')}</th>`;
    } else if (area === 'b') {
      html += `<th>${sortLink('本地路径','path')}</th><th>WebDAV 路径</th><th>指纹</th><th>状态</th><th>${sortLink('时间','time')}</th>`;
    } else if (area === 'c') {
      html += `<th>${sortLink('本地路径','path')}</th><th>WebDAV 路径</th><th>原 B 路径</th><th>幽灵根</th><th>${sortLink('时间','time')}</th>`;
    }

    html += '</tr></thead><tbody>';

    season.records.forEach((r, i) => {
      html += '<tr>';
      html += `<td>${i+1}</td>`;
      if (area === 'a') {
        html += `<td class="mono" title="${esc(r.local_path)}">${esc(stripPath(r.local_path, localRoot))}</td><td class="mono" title="${esc(r.webdav_path)}">${esc(stripPath(r.webdav_path, webdavRoot))}</td><td>${fmtTime(r.updated_at)}</td>`;
      } else if (area === 'b') {
        const fp = r.fingerprint || '-'; const fpShort = fp.length > 5 ? fp.substring(0,5) + '...' : fp;
        html += `<td class="mono" title="${esc(r.local_path)}">${esc(stripPath(r.local_path, localRoot))}</td><td class="mono" title="${esc(r.webdav_path)}">${esc(stripPath(r.webdav_path, webdavRoot))}</td><td class="mono" style="font-size:calc(var(--font-base) - 2px);cursor:default" title="${esc(fp)}">${esc(fpShort)}</td><td>${esc(r.status||'-')}</td><td>${fmtTime(r.updated_at)}</td>`;
      } else if (area === 'c') {
        html += `<td class="mono" title="${esc(r.local_path)}">${esc(stripPath(r.local_path, localRoot))}</td><td class="mono" title="${esc(r.webdav_path)}">${esc(stripPath(r.webdav_path, webdavRoot))}</td><td class="mono">${esc(r.original_b_path||'-')}</td><td class="mono">${esc(r.ghost_root||'-')}</td><td>${fmtTime(r.moved_at)}</td>`;
      }
      html += '</tr>';
    });

    html += '</tbody></table></div></details>';
  }

  // Pager
  if (d.total_pages > 1) {
    html += '<div class="pager">';
    if (d.page > 1) {
      html += `<a href="#area_${area}?media=${encodeURIComponent(media)}&page=${d.page-1}&sort=${sort}&order=${order}${kind?'&kind='+encodeURIComponent(kind):''}">${icon('chevron_l')} 上一页</a>`;
    }
    html += `<span class="current">第 ${d.page} / ${d.total_pages} 页</span>`;
    if (d.page < d.total_pages) {
      html += `<a href="#area_${area}?media=${encodeURIComponent(media)}&page=${d.page+1}&sort=${sort}&order=${order}${kind?'&kind='+encodeURIComponent(kind):''}">下一页 ${icon('chevron_r')}</a>`;
    }
    html += '</div>';
  }

  el.innerHTML = html;

  // Bind expand/collapse
  const expandAllBtn = document.getElementById('expand-all-btn');
  const collapseAllBtn = document.getElementById('collapse-all-btn');
  const setDetailToggleState = (opened) => {
    expandAllBtn?.classList.toggle('is-active', opened);
    collapseAllBtn?.classList.toggle('is-active', !opened);
  };
  expandAllBtn?.addEventListener('click', () => {
    document.querySelectorAll('.season-details').forEach(d => d.setAttribute('open', ''));
    setDetailToggleState(true);
  });
  collapseAllBtn?.addEventListener('click', () => {
    document.querySelectorAll('.season-details').forEach(d => d.removeAttribute('open'));
    setDetailToggleState(false);
  });
  setDetailToggleState(document.querySelectorAll('.season-details').length > 0);

}
