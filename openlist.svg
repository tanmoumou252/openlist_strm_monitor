@name           SearchEngineJumpPlusGlobalStyle
@description    Global style for SearchEngineJumpPlus
@version        5.31.9
@namespace      https://greasyfork.org/en/scripts/454280-searchenginejumpplus
@license        MIT
@author         MUTED64
@downloadURL https://update.greasyfork.org/scripts/558761/SearchEngineJumpPlusGlobalStyle.user.css
@updateURL https://update.greasyfork.org/scripts/558761/SearchEngineJumpPlusGlobalStyle.meta.css
==/UserStyle== */

#settingLayerMask {
  display: none;
  justify-content: center;
  align-items: center;
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  background-color: rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(10px);
  z-index: 200000000;
  overflow: auto;
  font-family: sans-serif;
  min-height: 100%;
  font-size: 16px;
  transition: 0.3s;
  opacity: 0;
  user-select: none;
  -moz-user-select: none;
  padding-bottom: 80px;
  box-sizing: border-box;
  color: var(--font-color-qxin);
}
#settingLayer {
  display: flex;
  flex-wrap: wrap;
  padding: 20px 20px 50px 20px;
  margin: 2% 0 50px;
  background-color: var(--background-setting-qxin);
  border-radius: 8px;
  position: absolute;
  min-width: 900px;
  max-width: 94%;
  transition: 0.5s;
}
.iqxin-items {
  min-width: 5em;
  margin: 0 2px 0px;
}
#settingLayer .drag {
  display: block;
  position: relative;
}
#settingLayer .sej-engine {
  padding: 0 calc(0.3em + 26px) 0 0.7em;
  width: 100%;
  box-sizing: border-box;
}
.iqxin-pointer-events,
.sej-engine-icon,
#settingLayer .sej-engine * {
  pointer-events: none;
}
.sejtitle {
  text-align: center;
  padding: 2px 0;
  cursor: pointer;
  position: relative;
  line-height: 1.8;
}
#settingLayerMask [data-xin] {
  margin: 2px 0;
  border-radius: 4px;
}
#settingLayerMask .iqxin-set-edit,
#settingLayerMask .iqxin-set-del,
#settingLayerMask .iqxin-title-edit {
  border-radius: 4px;
  line-height: 1em;
  margin-right: 0.3em;
}
.sejcon [data-xin] {
  cursor: pointer;
}
#settingLayerMask [data-iqxindisabled="true"],
[data-xin^="-"] {
  background-color: var(--background-avtive-color-qxin);
  text-decoration: line-through !important;
  text-decoration-color: red !important;
  transition: 0.3s;
}
.sejtitle:not([data-xin^="-"]):hover {
  background: var(--background-active-enable-qxin);
}
#settingLayerMask .sej-engine:hover {
  background-color: var(--background-active-enable-qxin);
}
#settingLayerMask [data-iqxindisabled="true"]:hover,
[data-xin^="-"]:hover {
  background-color: var(--background-active-disable-qxin);
}
#settingLayerMask label {
  cursor: pointer;
}
#settingLayerMask .sej-engine-icon {
  vertical-align: middle;
}
div.btnEleLayer {
  margin-bottom: -.66%;
}
#btnEle2,
#btnEle {
  position: absolute;
  width: 100%;
  bottom: 0px;
  right: 0;
  background: var(--background-setting-qxin);
  border-radius: 8px;
}
#btnEle2 span,
#btnEle span {
	display: inline-block;
	background: var(--background-btn-qxin);
	border: 1px solid #3abdc1;
	margin: 1px 0 0 0;
	color: #3abdc1;
	padding: .5% 5px 5px 5px;
	border-radius: 4px;
	cursor: pointer;
	outline: none;
	transition: 0.3s;
	line-height: 2.2em;
}
#btnEle label,
#btnEle2 label {
  color: #3abdc1;
}
#btnEle span:hover label,
#btnEle2 span:hover label {
  color: #fff;
}
#btnEle a {
  color: #999;
  text-decoration: none;
  font-family: auto;
}
#btnEle a:hover {
  text-decoration: none;
  color: #ef8957;
}
#btnEle2 span.feedback:hover,
#btnEle span.feedback:hover {
  border-color: #ef8957;
}
#btnEle2 span:not(.feedback):hover,
#btnEle span:not(.feedback):hover,
#btnEle2 span:not(.feedback):hover select,
#btnEle span:not(.feedback):hover select {
  background: #3acbdd;
  color: #fff;
}
#btnEle2 span:not(.feedback) option,
#btnEle span:not(.feedback) option {
  background: var(--background-btn-qxin);
  color: var(--font-color-qxin);
}
#btnEle .feedback {
  text-decoration: none;
  border-color: #aaa;
}
#btnEle2 &gt; div,
#btnEle &gt; div {
  width: 100%;
  display: flex;
  justify-content: space-around;
  background: var(--background-btn-qxin);
  border-radius: 4px;
}
#btnEle2 {
  visibility: hidden;
  opacity: 0;
  transform: translate(0, 40px);
  transition: 0.3s;
}
#btnEle2.btnEle2active {
  visibility: visible;
  opacity: 1;
  transform: translate(0, 53px);
  height: 1.5em;
}
#settingLayerMask input[type="checkbox"] {
  width: 12px;
  height: 12px;
  display: inline-block;
  text-align: center;
  vertical-align: middle;
  line-height: 10px !important;
  margin: 0 5px 5px 5px !important;
  position: relative;
}
#settingLayerMask input[type="checkbox"]:before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  background: #fff;
  width: 100%;
  height: 100%;
  border: 1px solid #d9d9d9;
}
#settingLayerMask input[type="checkbox"]:checked:after {
  content: "â";
  background-color: #63d4d8;
  position: absolute;
  top: 0;
  left: 0;
  width: 12px;
  height: 12px;
  border: 1px solid #63d4d8;
  color: #fff;
  font-size: 10px;
}
.drop-over {
  opacity: 0.6;
}
.iqxin-title-edit,
.iqxin-set-edit,
.iqxin-set-title-del,
.iqxin-set-del {
  visibility: hidden;
  opacity: 0;
  position: absolute;
  background: rgba(207, 249, 255, 0.86);
  color: red;
  top: 50%;
  transform: translate(0, -50%);
  right: 0;
  padding: 3px 3px 4.5px 4.5px;
  border-radius: 4px;
  cursor: pointer;
  transition: 0.3s;
}
.iqxin-set-title-del.iqxin-set-active {
  background: #fff;
  border-radius: 4px 0 0 4px;
}
span.iqxin-additem {
  display: inline-block;
  text-align: center;
  width: 100%;
  margin: 10px 0;
  border: 1px dotted red;
  color: red;
  cursor: pointer;
  visibility: hidden;
  opacity: 0;
  transition: 0.3s;
  transform: scale(0);
}
span.iqxin-additem.iqxin-set-active {
  visibility: visible;
  opacity: 1;
  margin: 10px 0;
  transform: scale(1);
}
#settingLayer .sejtitle:hover .iqxin-title-edit,
#settingLayer .sejcon &gt; span:hover .iqxin-set-edit {
  visibility: visible;
  opacity: 0.8;
}
#nSearchList.iqxin-set-active,
.iqxin-set-edit.iqxin-set-active,
.iqxin-set-title-del.iqxin-set-active,
.iqxin-set-del.iqxin-set-active {
  visibility: visible !important;
  opacity: 1 !important;
}
#btnEle span.iqxin-btn-active {
  color: red;
  border-color: red;
}
#newSearchListBox,
#newSearchBox {
  transition: 0.3s;
  transform: translateY(0%);
  opacity: 1;
  position: fixed;
  z-index: 200000100;
  top: 50%;
  left: 50%;
  padding: 22px;
  background: rgba(179, 220, 221, 0.94);
  border-radius: 4px;
  color: #000;
  margin: -149px -117px;
}
#newSearchListBox input,
#newSearchBox input {
  border: none;
  padding: 4px 0 4px 5px;
  border-radius: 4px;
  outline: none;
}
#newSearchListBox input:focus,
#newSearchBox input:focus {
  background: #f1d2d2;
  transition: 0.5s;
}
.addItemBoxBtn {
  cursor: pointer;
  background: #fff;
  border: none;
  border-radius: 4px;
  padding: 4px 10px;
  color: #333;
  transition: 0.3s;
}
#xin-centerDisplay select,
#xin-newtab select {
  height: auto;
  border: none;
  outline: none;
  color: #3abdc1;
  font-size: 1em;
  font-family: sans-serif;
  padding: 0px 5px;
  cursor: pointer;
  text-decoration: none;
  background: var(--background-btn-qxin);
  transition: 0.3s;
}
#titleEdit {
  width: 6em;
}
.iqxin-closeBtn,
.iqxin-enterBtn {
  box-sizing: border-box;
}
.iqxin-closeBtn:hover {
  background: #ff6565;
  border-color: #ff6565;
  color: #fff;
}
.iqxin-enterBtn:hover {
  background: #84bb84;
  border-color: #84bb84;
  color: #fff;
}
#iqxin-editCodeBox button {
  cursor: pointer;
}
#xin-close {
  background: white;
  color: #3abdc1;
  line-height: 20px;
  text-align: center;
  height: 20px;
  width: 20px;
  text-align: center;
  font-size: 20px;
  padding: 10px;
  border: 3px solid #3abdc1;
  border-radius: 50%;
  transition: 0.5s;
  top: -20px;
  right: -20px;
  position: absolute;
  box-sizing: unset;
  cursor: pointer;
}
#xin-close::before {
  content: "\2716";
  margin: -10px;
}
#xin-close:hover {
  background: indianred;
  border-color: indianred;
  color: #fff;
}
input#setBtnOpacityRange[type="range"] {
  outline: none;
  appearance: none;
  background: -webkit-linear-gradient(left, #3abdc1, #83e7ea) no-repeat, #fff;
  border-radius: 10px; 
}
input#setBtnOpacityRange[type="range"]::-webkit-slider-thumb {
  appearance: none;
}
input#setBtnOpacityRange[type="range"]::-webkit-slider-runnable-track {
  height: 10px;
  border-radius: 10px; 
  box-shadow: 0 1px 1px #def3f8, inset 0 0.125em 0.125em #0d1112; 
}
input#setBtnOpacityRange[type="range"]::-webkit-slider-thumb {
  appearance: none;
  height: 18px;
  width: 18px;
  margin-top: -5px; 
  background: #fff;
  border-radius: 50%; 
  border: solid 0.125em rgba(205, 224, 230, 0.5); 
  box-shadow: 0 0.125em 0.125em #3b4547; 
}
#importingBox {
  position: fixed;
  width: 350px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 15px 30px;
  border-radius: 4px;
  background: #1d1d1d;
  color: #fff;
}
#importingBox li {
  margin: 5px;
  border-bottom: 1px solid #3acbdd;
}
#importingBox li p {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 0;
  margin-bottom: 0;
}
.xin-importing-item {
  cursor: pointer;
}
#setBtn {
  transition: 0.5s;
  padding: 0 1em;
  height: 2.6em;
  align-items: center;
  cursor: pointer;
  display: flex;
}
span#setBtn:hover {
  opacity: 1;
  background-color: var(--background-hover-color-qxin);
}
#sej-container {
  display: flex;
  align-items: center;
  position: relative;
  z-index: 2;
  padding: 0;
  font-size: 13px;
  font-family: sans-serif;
  transform-origin: top center;
  animation: sejopen 0.3s;
  color: var(--font-color-qxin);
  background: var(--background-color-qxin);
  backdrop-filter: blur(40px);
  width: max-content !important;
  border-radius: 8px;
  border-width: thin;
  border-style: solid;
  border-color: var(--border-color-sej);
  overflow: hidden;
  box-shadow: 0 0 0.6em var(--box-shadow-color-sej);
  height: fit-content;
  flex-wrap: wrap;
  justify-content: center;
  user-select: none;
}

#iqixn-global-tip {
  box-sizing: content-box !important;
  opacity: 0;
  height: 25px;
  line-height: 25px;
  letter-spacing: 1px;
  font-size: 14px;
  color: #fff;
  padding: 5px 20px;
  border-radius: 8px;
  background-color: #666;
  position: fixed;
  z-index: 200000001;
  left: 50%;
  bottom: 5%;
  transform: translate(-50%);
  transition: 0.4s;
}

body {
  --font-color-qxin: #333;
  --background-color-qxin: #fffffff0;
  --background-avtive-color-qxin: #ccc;
  --background-active-enable-qxin: #cff9ff;
  --background-active-disable-qxin: #ffa2a2;
  --background-hover-color-qxin: #eaeaea;
  --trigger-shown-qxin: #deedff !important;
  --background-btn-qxin: #eff4f8;
  --background-setting-qxin: #fff;
  --box-shadow-color-sej: hsla(0, 0%, 0%, 7%);
  --border-color-sej: #e1e6ea;
}
body[qxintheme="dark"] {
  --font-color-qxin: #bdc1bc;
  --background-color-qxin: #202124f0;
  --background-avtive-color-qxin: #424242;
  --background-active-enable-qxin: #274144;
  --background-active-disable-qxin: #583535;
  --background-hover-color-qxin: #424242;
  --trigger-shown-qxin: #424242 !important;
  --background-btn-qxin: #292f36;
  --background-setting-qxin: #202124;
  --box-shadow-color-sej: hsla(0, 0%, 70%, 10%);
  --border-color-sej: #3b4547;
}

#sej-container.selectSearch {
  position: fixed;
  top: -50px;
  left: 0;
  right: 0;
  z-index: 99999999;
  transition: 0.3s;
  margin: 0 auto;
}
#sej-expanded-category {
  font-weight: bold;
}
.sej-engine {
  padding: 0 13px;
  transition: background-color 0.2s ease-out;
  font-size: 13px;
  font-family: sans-serif;
  display: inline-flex;
  gap: 8px;
  align-items: center;
  height: 2.6em;
  text-decoration: none !important;
  color: var(--font-color-qxin) !important;
  cursor: pointer;
}
.sej-drop-list a:visited,
.sej-drop-list a:hover,
.sej-engine a:visited,
.sej-engine a:hover,
#sej-container a:link,
#sej-container a:visited,
#sej-container a:hover {
  color: var(--font-color-qxin);
}
.sej-engine:hover {
  background-color: var(--background-hover-color-qxin);
}
.sej-drop-list &gt; .sej-engine {
  display: flex;
  justify-content: flex-start;
}

.sej-engine-icon {
  width: 16px;
  margin: 0;
}

.sej-drop-list {
  position: absolute;
  display: none;
  opacity: 0.2;
  top: -10000px;
  left: 0;
  min-width: 90px;
  text-align: left;
  font-size: 13px;
  box-shadow: 0em 0.6em 0.6em var(--box-shadow-color-sej);
  background-color: var(--background-color-qxin);
  backdrop-filter: blur(40px);
  transition: opacity 0.2s ease-out, top 0.2s ease-out;
  overflow: hidden;
  border-radius: 8px;
  border-width: thin;
  border-style: solid;
  border-color: var(--border-color-sej);
  user-select: none;
}
@keyframes sejopen {
  0% {
    transform: scale(1, 0.1);
    opacity: 0;
  }
  100% {
    transform: scale(1, 1);
    opacity: 1;
  }
}
@keyframes iqxinsejopen {
  0% {
    transform: scale(0.01, 0.01);
    opacity: 0;
  }
  100% {
    transform: scale(1, 1);
    opacity: 1;
  }
}

#iqxin-newTitle,
#iqxin-newLink,
#iqxin-newIcon,
#iqxin-newTarget {
  background-color: #55c6ca70;
}</style><style xmlns="http://www.w3.org/1999/xhtml">.sej-engine,.sej-drop-list-trigger,.sej-drop-list{transition:none!important;}#sej-container{animation:none!important;}.sej-drop-list {backdrop-filter:none!important;}</style>
</svg>